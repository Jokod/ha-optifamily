# Dashboard OptiFamily avancé
#
# Import : Paramètres → Tableaux de bord → Ajouter → Importer YAML
# Puis adaptez les entity_id (filtre « optifamily » dans Outils de développement).
#
# Cartes utilisées : markdown (Jinja), glance, entities, conditional, history-graph.
# Aucune carte custom (HACS) requise.

title: OptiFamily
views:
  - title: Aujourd'hui
    path: aujourdhui
    icon: mdi:calendar-today
    cards:
      - type: markdown
        content: |
          # OptiFamily
          {{ now().strftime('%A %d %B %Y') }}
          {% set liste = state_attr('sensor.optifamily_enfants', 'liste') or [] %}
          {% set presents = liste | selectattr('presence', 'equalto', 'présent') | list %}
          **{{ presents | length }}** / **{{ liste | length }}** enfant(s) en crèche aujourd'hui
          · Msg crèche : **{{ states('sensor.optifamily_messages_non_lus_creche') }}**
          · Msg moi : **{{ states('sensor.optifamily_messages_non_lus_moi') }}**

      - type: glance
        title: Compte
        show_state: true
        entities:
          - entity: sensor.optifamily_enfants
            name: Enfants
          - entity: sensor.optifamily_enfants_en_creche_aujourd_hui
            name: Présents
          - entity: sensor.optifamily_messages_non_lus_creche
            name: Msg crèche
          - entity: sensor.optifamily_messages_non_lus_moi
            name: Msg moi
          - entity: sensor.optifamily_actualites
            name: Actus

      - type: conditional
        conditions:
          - condition: numeric_state
            entity_id: sensor.optifamily_messages_non_lus_creche
            above: 0
        card:
          type: markdown
          content: |
            ### Messages de la crèche
            **{{ states('sensor.optifamily_messages_non_lus_creche') }}** message(s) non lu(s)
            {% set d = state_attr('sensor.optifamily_messages_non_lus_creche', 'last_unread_date') %}
            {% if d %}· dernier : {{ d }}{% endif %}

      - type: conditional
        conditions:
          - condition: numeric_state
            entity_id: sensor.optifamily_messages_non_lus_moi
            above: 0
        card:
          type: markdown
          content: |
            ### Messages envoyés (non lus)
            **{{ states('sensor.optifamily_messages_non_lus_moi') }}** message(s) encore non lu(s)
            {% set d = state_attr('sensor.optifamily_messages_non_lus_moi', 'last_unread_date') %}
            {% if d %}· dernier : {{ d }}{% endif %}

      - type: markdown
        title: Enfants
        content: |
          {% set liste = state_attr('sensor.optifamily_enfants', 'liste') or [] %}
          {% if liste | length == 0 %}
          *Aucun enfant détecté — vérifiez la configuration OptiFamily.*
          {% else %}
          {% for e in liste %}
          ### {{ e.libelle }}
          {% if e.presence == 'présent' %}🟢{% elif e.presence == 'absent' %}⚪{% else %}❓{% endif %}
          **{{ e.presence }}**
          {% if e.creneaux %} · {{ e.creneaux | join(' · ') }}{% endif %}

          Transmissions : **{{ e.transmissions }}** · Albums : **{{ e.albums }}** · Créneaux mois : **{{ e.creneaux_mois }}**

          {% endfor %}
          {% endif %}

  - title: Détail
    path: detail
    icon: mdi:account-child
    cards:
      - type: markdown
        content: >
          Remplacez les entités ci-dessous par celles de chaque enfant
          (un bloc par enfant). Les noms varient selon les prénoms.

      - type: entities
        title: Enfant 1
        show_header_toggle: false
        entities:
          - entity: sensor.prenom_enfant_1_present_aujourd_hui
            name: Présent aujourd'hui
          - type: attribute
            entity: sensor.prenom_enfant_1_present_aujourd_hui
            attribute: creneaux
            name: Créneaux du jour
          - entity: sensor.prenom_enfant_1_creneaux_ce_mois
            name: Créneaux ce mois
          - entity: sensor.prenom_enfant_1_transmissions_du_jour
            name: Transmissions
          - entity: sensor.prenom_enfant_1_albums
            name: Albums

      - type: entities
        title: Enfant 2 (si applicable)
        show_header_toggle: false
        entities:
          - entity: sensor.prenom_enfant_2_present_aujourd_hui
            name: Présent aujourd'hui
          - type: attribute
            entity: sensor.prenom_enfant_2_present_aujourd_hui
            attribute: creneaux
            name: Créneaux du jour
          - entity: sensor.prenom_enfant_2_creneaux_ce_mois
            name: Créneaux ce mois
          - entity: sensor.prenom_enfant_2_transmissions_du_jour
            name: Transmissions

  - title: Historique
    path: historique
    icon: mdi:chart-line
    cards:
      - type: history-graph
        title: 7 derniers jours
        hours_to_show: 168
        entities:
          - entity: sensor.optifamily_enfants_en_creche_aujourd_hui
            name: Présents
          - entity: sensor.optifamily_messages_non_lus_creche
            name: Msg crèche
          - entity: sensor.optifamily_messages_non_lus_moi
            name: Msg moi

      - type: markdown
        content: |
          ### Automatisations recommandées
          - Blueprint **Bilan du soir**
          - Blueprint **Changement de présence**
          - Blueprint **Messages (seuil)**
          - Script **Résumé famille**
          - Package `packages/optifamily_helpers.yaml` (mode silencieux + capteur résumé)
