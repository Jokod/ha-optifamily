# OptiFamily dashboard — English
#
# HACS Frontend (manual): Mushroom, card-mod, auto-entities, week-planner-card
# Import: Settings → Dashboards → Add → Import YAML
# Cards discover sensors via the optifamily_kind attribute.
# Presence states stay French (`présent` / `absent`); this file translates them.

title: OptiFamily
views:
  # ─── Today ─────────────────────────────────────────────────────
  - title: Today
    path: today
    icon: mdi:hand-wave
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-template-card
            layout: horizontal
            multiline_secondary: true
            tap_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  border-radius: 28px;
                  border: none;
                  box-shadow: none;
                  padding: 4px 2px;
                  background: linear-gradient(
                    125deg,
                    rgba(245,158,11,.26) 0%,
                    rgba(13,148,136,.20) 48%,
                    rgba(59,130,246,.12) 100%
                  );
                }
            icon: >
              {% set h = now().hour %}
              {% if h < 6 %}mdi:weather-night
              {% elif h < 12 %}mdi:weather-sunset-up
              {% elif h < 18 %}mdi:white-balance-sunny
              {% else %}mdi:weather-sunset
              {% endif %}
            icon_color: >
              {% set h = now().hour %}
              {% if h < 6 %}indigo
              {% elif h < 12 %}amber
              {% elif h < 18 %}orange
              {% else %}deep-orange
              {% endif %}
            primary: >
              {% set h = now().hour %}
              {% set j = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}
              {% set m = ['January','February','March','April','May','June','July','August','September','October','November','December'] %}
              {% if h < 6 %}Good night
              {% elif h < 12 %}Good morning
              {% elif h < 18 %}Good afternoon
              {% else %}Good evening
              {% endif %} · {{ j[now().weekday()] }} {{ now().day }} {{ m[now().month - 1] }}
            secondary: >
              {% set s = states.sensor
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
              {% set liste = (s[0].attributes.liste if s else []) or [] %}
              {% set presents = liste | selectattr('presence', 'equalto', 'présent') | list %}
              {% set n = liste | length %}
              {% if n == 0 %}Integration not found, or no children configured.
              {% elif presents | length == 0 %}
                {% if n == 1 %}{{ liste[0].libelle }} is at home today.
                {% else %}Home day — nobody at daycare.
                {% endif %}
              {% else %}
                {% set ns = namespace(drop=none, pick=none, mid=[], done=[]) %}
                {% for e in presents %}
                  {% set label = (e.creneaux[0] if e.creneaux else '') %}
                  {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                  {% if times | length >= 2 %}
                    {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                    {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                    {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                    {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                    {% if to_start > 0 %}
                      {% if ns.drop is none or to_start < ns.drop.mins %}
                        {% set ns.drop = {'name': e.libelle, 'mins': to_start, 'at': times[0][0] ~ ':' ~ times[0][1]} %}
                      {% endif %}
                    {% elif to_end > 0 %}
                      {% set ns.mid = ns.mid + [e.libelle] %}
                      {% if ns.pick is none or to_end < ns.pick.mins %}
                        {% set ns.pick = {'name': e.libelle, 'mins': to_end, 'at': times[1][0] ~ ':' ~ times[1][1]} %}
                      {% endif %}
                    {% else %}
                      {% set ns.done = ns.done + [e.libelle] %}
                    {% endif %}
                  {% else %}
                    {% set ns.mid = ns.mid + [e.libelle] %}
                  {% endif %}
                {% endfor %}
                {% if ns.drop %}
                  {% set m = ns.drop.mins %}
                  {% if m > 90 %}Drop off {{ ns.drop.name }} at {{ ns.drop.at }}.
                  {% elif m >= 60 %}Drop off {{ ns.drop.name }} in {{ m // 60 }} h{% if m % 60 %} {{ m % 60 }} min{% endif %}.
                  {% else %}Drop off {{ ns.drop.name }} in {{ m }} min.
                  {% endif %}
                {% elif ns.pick and ns.pick.mins <= 90 %}
                  {% set m = ns.pick.mins %}
                  {% if m >= 60 %}Pick up {{ ns.pick.name }} in {{ m // 60 }} h{% if m % 60 %} {{ m % 60 }} min{% endif %}.
                  {% else %}Pick up {{ ns.pick.name }} in {{ m }} min.
                  {% endif %}
                {% elif ns.mid %}
                  {{ ns.mid | join(', ') }} at daycare{% if ns.pick %} · pick up at {{ ns.pick.at }}{% endif %}.
                {% elif ns.done | length == 1 %}
                  {{ ns.done[0] }} is home.
                {% elif ns.done %}
                  Everyone is home.
                {% else %}
                  {{ presents | map(attribute='libelle') | join(', ') }} at daycare.
                {% endif %}
              {% endif %}

      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  border: none;
                  box-shadow: none;
                  background: transparent;
                }
            chips:
              - type: template
                icon: mdi:baby-carriage
                icon_color: >
                  {% set p = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'enfants_presents') | list %}
                  {{ 'teal' if p and p[0].state | int(0) > 0 else 'blue-grey' }}
                content: >
                  {% set p = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'enfants_presents') | list %}
                  {% set n = (p[0].state | int(0)) if p else 0 %}
                  {% if n == 0 %}Nobody at daycare
                  {% elif n == 1 %}1 at daycare
                  {% else %}{{ n }} at daycare
                  {% endif %}
              - type: template
                icon: mdi:email-receive-outline
                icon_color: >
                  {% set m = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
                  {{ 'red' if m and m[0].state | int(0) > 0 else 'teal' }}
                content: >
                  {% set m = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
                  {% set n = (m[0].state | int(0)) if m else 0 %}
                  {% if n == 0 %}Inbox clear
                  {% else %}{{ n }} daycare message{{ 's' if n != 1 }}
                  {% endif %}
              - type: template
                icon: mdi:clock-check-outline
                icon_color: cyan
                content: >
                  {% set sync = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'dernier_rafraichissement') | list %}
                  {% if sync and sync[0].state not in ['unknown', 'unavailable', none] %}
                    Updated {{ relative_time(as_datetime(sync[0].state)) }}
                  {% else %}Sync unknown
                  {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Today’s presence
            heading_style: title
            icon: mdi:account-child
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            sort:
              method: attribute
              attribute: enfant_libelle
            card:
              type: vertical-stack
            card_param: cards
            filter:
              exclude:
                - state: unavailable
              include:
                - attributes:
                    optifamily_kind: present
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    layout: horizontal
                    multiline_secondary: true
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 22px;
                          border: none;
                          box-shadow: none;
                        }
                    icon: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}mdi:home-heart
                      {% elif st != 'présent' %}mdi:help-circle-outline
                      {% elif times | length < 2 %}mdi:baby-face-outline
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}mdi:car-child-seat
                        {% elif to_end > 90 %}mdi:baby-face-outline
                        {% elif to_end > 0 %}mdi:clock-end
                        {% else %}mdi:home-import-outline
                        {% endif %}
                      {% endif %}
                    icon_color: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}blue-grey
                      {% elif st != 'présent' %}amber
                      {% elif times | length < 2 %}teal
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}amber
                        {% elif to_end > 90 %}teal
                        {% elif to_end > 0 %}orange
                        {% else %}blue-grey
                        {% endif %}
                      {% endif %}
                    badge_icon: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}mdi:home
                      {% elif st != 'présent' %}mdi:alert-circle-outline
                      {% elif times | length < 2 %}mdi:check-circle
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}mdi:arrow-right-bold-circle
                        {% elif to_end > 90 %}mdi:check-circle
                        {% elif to_end > 0 %}mdi:bell-ring
                        {% else %}mdi:home
                        {% endif %}
                      {% endif %}
                    badge_color: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}grey
                      {% elif st != 'présent' %}amber
                      {% elif times | length < 2 %}teal
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}amber
                        {% elif to_end > 90 %}teal
                        {% elif to_end > 0 %}orange
                        {% else %}grey
                        {% endif %}
                      {% endif %}
                    primary: "{{ state_attr(entity, 'enfant_libelle') }}"
                    secondary: >
                      {% set st = states(entity) %}
                      {% set name = state_attr(entity, 'enfant_libelle') %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}{{ name }} is at home
                      {% elif st != 'présent' %}Presence unknown
                      {% elif times | length < 2 %}{{ name }} is at daycare
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 90 %}Drop off {{ name }} at {{ times[0][0] }}:{{ times[0][1] }}
                        {% elif to_start > 0 %}Drop off {{ name }} {% if to_start >= 60 %}in {{ to_start // 60 }} h{% if to_start % 60 %} {{ to_start % 60 }} min{% endif %}{% else %}in {{ to_start }} min{% endif %}
                        {% elif to_end > 90 %}At daycare · pick up at {{ times[1][0] }}:{{ times[1][1] }}
                        {% elif to_end > 0 %}Pick up {{ name }} {% if to_end >= 60 %}in {{ to_end // 60 }} h{% if to_end % 60 %} {{ to_end % 60 }} min{% endif %}{% else %}in {{ to_end }} min{% endif %}
                        {% else %}{{ name }} is home
                        {% endif %}
                      {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Mailbox
            heading_style: title
            icon: mdi:mailbox-open-outline
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - attributes:
                    optifamily_kind: messages_unread_creche
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:email-receive
                    layout: horizontal
                    multiline_secondary: true
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: From daycare
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% set total = state_attr(entity, 'total') %}
                      {% if n == 0 %}No unread messages
                      {% else %}{{ n }} unread{% if total is not none %} · {{ total }} total{% endif %}
                      {% endif %}
                      {% set d = state_attr(entity, 'last_unread_date') or state_attr(entity, 'last_message_date') %}
                      {% if d %} · {{ d }}{% endif %}
                    icon_color: "{{ 'red' if states(entity) | int(0) > 0 else 'teal' }}"
                    badge_icon: "{{ 'mdi:bell-badge' if states(entity) | int(0) > 0 else none }}"
                    badge_color: red
                - attributes:
                    optifamily_kind: messages_unread_me
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:email-send
                    layout: horizontal
                    multiline_secondary: true
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: Sent by you
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% set total = state_attr(entity, 'total') %}
                      {% if n == 0 %}Nothing waiting to be read
                      {% else %}{{ n }} unread on daycare side{% if total is not none %} · {{ total }} sent{% endif %}
                      {% endif %}
                    icon_color: "{{ 'orange' if states(entity) | int(0) > 0 else 'teal' }}"
                    badge_icon: "{{ 'mdi:bell-badge' if states(entity) | int(0) > 0 else none }}"
                    badge_color: orange

      - type: grid
        cards:
          - type: heading
            heading: Daycare life
            heading_style: title
            icon: mdi:town-hall
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - attributes:
                    optifamily_kind: actualites_total
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:newspaper-variant-outline
                    icon_color: teal
                    layout: horizontal
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: News
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% if n == 0 %}No news
                      {% elif n == 1 %}1 news item
                      {% else %}{{ n }} news items
                      {% endif %}
                - attributes:
                    optifamily_kind: documents_total
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:file-document-outline
                    icon_color: cyan
                    layout: horizontal
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: Documents
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% if n == 0 %}No documents
                      {% elif n == 1 %}1 document
                      {% else %}{{ n }} documents
                      {% endif %}
                - attributes:
                    optifamily_kind: facturation_total
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:receipt-text-outline
                    icon_color: amber
                    layout: horizontal
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: Invoices
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% if n == 0 %}No invoices
                      {% elif n == 1 %}1 invoice
                      {% else %}{{ n }} invoices
                      {% endif %}

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Next 7 days at a glance
            heading_style: title
            icon: mdi:calendar-week
          - type: markdown
            content: |
              {% set jn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] %}
              {% set slots = states.sensor
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'planning_slots') | list %}
              {% set start = now().date() %}
              <div class="of-week">
              {% for i in range(7) %}
              {% set day = start + timedelta(days=i) %}
              {% set bits = namespace(items=[]) %}
              {% for s in slots %}
              {% for row in s.attributes.jours or [] %}
              {% set raw = as_datetime(row.date) if row.date else none %}
              {% set jd = raw.date() if raw else none %}
              {% if jd == day %}
              {% set bits.items = bits.items + [ (s.attributes.enfant_libelle or 'Child') ~ ' · ' ~ (row.creneaux | join(' · ')) ] %}
              {% endif %}
              {% endfor %}
              {% endfor %}
              <div class="of-day{% if i == 0 %} of-today{% endif %}{% if day.weekday() >= 5 %} of-weekend{% endif %}{% if bits.items | length == 0 %} of-empty{% endif %}">
              <div class="of-kicker">{{ jn[day.weekday()] }}</div>
              <div class="of-num">{{ day.day }}</div>
              <div class="of-body">{% if bits.items %}{% for line in bits.items %}<div class="of-line">{{ line }}</div>{% endfor %}{% else %}<div class="of-libre">Free</div>{% endif %}</div>
              </div>
              {% endfor %}
              </div>
            card_mod:
              style:
                .: |
                  ha-card {
                    border-radius: 24px;
                    border: none;
                    box-shadow: none;
                    overflow: hidden;
                  }
                ha-markdown:
                  $: |
                    .of-week {
                      display: grid;
                      grid-template-columns: repeat(7, minmax(0, 1fr));
                      gap: 10px;
                    }
                    @media (max-width: 1100px) {
                      .of-week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
                    }
                    @media (max-width: 700px) {
                      .of-week { grid-template-columns: repeat(2, minmax(0, 1fr)); }
                    }
                    .of-day {
                      border-radius: 18px;
                      padding: 12px 10px 14px;
                      min-height: 8.75rem;
                      background: color-mix(in srgb, var(--primary-color) 8%, var(--ha-card-background, var(--card-background-color)));
                      transition: opacity .15s ease;
                    }
                    .of-today {
                      background: color-mix(in srgb, #0d9488 24%, var(--ha-card-background, var(--card-background-color)));
                      box-shadow: inset 0 0 0 2px #0d9488;
                    }
                    .of-weekend {
                      background: color-mix(in srgb, var(--primary-color) 4%, var(--ha-card-background, var(--card-background-color)));
                    }
                    .of-empty { opacity: 0.7; }
                    .of-kicker {
                      font-size: 0.68rem;
                      letter-spacing: 0.1em;
                      text-transform: uppercase;
                      opacity: 0.65;
                      font-weight: 600;
                    }
                    .of-num {
                      font-size: 1.7rem;
                      font-weight: 750;
                      line-height: 1.1;
                      margin: 4px 0 10px;
                      letter-spacing: -0.02em;
                    }
                    .of-body { font-size: 0.76rem; line-height: 1.4; }
                    .of-line + .of-line { margin-top: 4px; }
                    .of-libre { opacity: 0.42; font-style: italic; }

  # ─── Children ──────────────────────────────────────────────────
  - title: Children
    path: children
    icon: mdi:account-child-circle
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Individual profiles
            heading_style: title
            icon: mdi:card-account-details-outline
          - type: markdown
            content: >
              {% set s = states.sensor
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
              {% set n = (s[0].state | int(0)) if s else 0 %}
              {% if n == 0 %}No children detected.
              {% elif n == 1 %}1 child tracked — presence, daily notes, albums and slots.
              {% else %}{{ n }} children tracked — presence, daily notes, albums and slots.
              {% endif %}
            card_mod:
              style: |
                ha-card {
                  border: none;
                  box-shadow: none;
                  background: transparent;
                  --ha-markdown-font-size: 0.9rem;
                  opacity: 0.75;
                }

      - type: grid
        column_span: 2
        cards:
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            sort:
              method: attribute
              attribute: enfant_libelle
            card:
              type: vertical-stack
            card_param: cards
            filter:
              exclude:
                - state: unavailable
              include:
                - attributes:
                    optifamily_kind: present
                  options:
                    type: vertical-stack
                    cards:
                      - type: custom:mushroom-template-card
                        entity: this.entity_id
                        layout: horizontal
                        multiline_secondary: true
                        tap_action:
                          action: more-info
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 24px 24px 8px 8px;
                              border: none;
                              box-shadow: none;
                              background: linear-gradient(
                                120deg,
                                color-mix(in srgb, #0d9488 16%, var(--ha-card-background, var(--card-background-color))),
                                var(--ha-card-background, var(--card-background-color))
                              );
                            }
                        icon: >
                          {% set st = states(entity) %}
                          {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                          {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                          {% if st == 'absent' %}mdi:home-heart
                          {% elif st != 'présent' %}mdi:help-circle-outline
                          {% elif times | length < 2 %}mdi:baby-face-outline
                          {% else %}
                            {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                            {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                            {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% if to_start > 0 %}mdi:car-child-seat
                            {% elif to_end > 90 %}mdi:baby-face-outline
                            {% elif to_end > 0 %}mdi:clock-end
                            {% else %}mdi:home-import-outline
                            {% endif %}
                          {% endif %}
                        icon_color: >
                          {% set st = states(entity) %}
                          {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                          {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                          {% if st == 'absent' %}blue-grey
                          {% elif st != 'présent' %}amber
                          {% elif times | length < 2 %}teal
                          {% else %}
                            {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                            {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                            {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% if to_start > 0 %}amber
                            {% elif to_end > 90 %}teal
                            {% elif to_end > 0 %}orange
                            {% else %}blue-grey
                            {% endif %}
                          {% endif %}
                        primary: "{{ state_attr(entity, 'enfant_libelle') }}"
                        secondary: >
                          {% set st = states(entity) %}
                          {% set name = state_attr(entity, 'enfant_libelle') %}
                          {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                          {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                          {% if st == 'absent' %}{{ name }} is at home
                          {% elif st != 'présent' %}Today’s status unknown
                          {% elif times | length < 2 %}{{ name }} is at daycare
                          {% else %}
                            {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                            {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                            {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% if to_start > 90 %}Drop off {{ name }} at {{ times[0][0] }}:{{ times[0][1] }}
                            {% elif to_start > 0 %}Drop off {{ name }} {% if to_start >= 60 %}in {{ to_start // 60 }} h{% if to_start % 60 %} {{ to_start % 60 }} min{% endif %}{% else %}in {{ to_start }} min{% endif %}
                            {% elif to_end > 90 %}At daycare · pick up at {{ times[1][0] }}:{{ times[1][1] }}
                            {% elif to_end > 0 %}Pick up {{ name }} {% if to_end >= 60 %}in {{ to_end // 60 }} h{% if to_end % 60 %} {{ to_end % 60 }} min{% endif %}{% else %}in {{ to_end }} min{% endif %}
                            {% else %}{{ name }} is home
                            {% endif %}
                          {% endif %}
                      - type: custom:mushroom-chips-card
                        alignment: justify
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 8px 8px 24px 24px;
                              border: none;
                              box-shadow: none;
                              margin-top: -6px;
                            }
                        chips:
                          - type: template
                            icon: mdi:clipboard-text-outline
                            icon_color: teal
                            content: >
                              {% set id = state_attr('this.entity_id', 'enfant_id') %}
                              {% set tr = states.sensor
                                | selectattr('attributes', 'contains', 'optifamily_kind')
                                | selectattr('attributes.optifamily_kind', 'eq', 'transmissions')
                                | selectattr('attributes.enfant_id', 'eq', id) | list %}
                              {% set n = (tr[0].state | int(0)) if tr else 0 %}
                              {% if n == 0 %}No daily notes
                              {% elif n == 1 %}1 daily note
                              {% else %}{{ n }} daily notes
                              {% endif %}
                            tap_action:
                              action: more-info
                              entity: this.entity_id
                          - type: template
                            icon: mdi:image-multiple-outline
                            icon_color: purple
                            content: >
                              {% set id = state_attr('this.entity_id', 'enfant_id') %}
                              {% set al = states.sensor
                                | selectattr('attributes', 'contains', 'optifamily_kind')
                                | selectattr('attributes.optifamily_kind', 'eq', 'albums')
                                | selectattr('attributes.enfant_id', 'eq', id) | list %}
                              {% set n = (al[0].state | int(0)) if al else 0 %}
                              {% if n == 0 %}No albums
                              {% elif n == 1 %}1 album
                              {% else %}{{ n }} albums
                              {% endif %}
                            tap_action:
                              action: more-info
                              entity: this.entity_id
                          - type: template
                            icon: mdi:calendar-month-outline
                            icon_color: cyan
                            content: >
                              {% set id = state_attr('this.entity_id', 'enfant_id') %}
                              {% set pl = states.sensor
                                | selectattr('attributes', 'contains', 'optifamily_kind')
                                | selectattr('attributes.optifamily_kind', 'eq', 'planning_slots')
                                | selectattr('attributes.enfant_id', 'eq', id) | list %}
                              {% set n = (pl[0].state | int(0)) if pl else 0 %}
                              {{ n }} slot{{ 's' if n != 1 }} this month
                            tap_action:
                              action: more-info
                              entity: this.entity_id

  # ─── Schedule ──────────────────────────────────────────────────
  - title: Schedule
    path: schedule
    icon: mdi:calendar-week
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Coming week
            heading_style: title
            icon: mdi:view-week-outline
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            card:
              type: custom:week-planner-card
              days: 7
              startingDay: today
              locale: en
              timeFormat: HH:mm
              showNavigation: true
              showLegend: true
              legendToggle: true
              combineSimilarEvents: true
              noCardBackground: true
              eventBackground: color-mix(in srgb, #0d9488 18%, var(--ha-card-background, var(--card-background-color)))
              dayFormat: '''<span class="number">''d''</span><span class="month">''ccc''</span>'''
              texts:
                noEvents: No slots
                fullDay: All day
                today: Today
                tomorrow: Tomorrow
                yesterday: Yesterday
                moreEvents: More slots
              card_mod:
                style: |
                  ha-card {
                    border-radius: 24px;
                    border: none;
                    box-shadow: none;
                    background: transparent;
                    padding: 0;
                  }
                  .day {
                    border-radius: 18px;
                    background: color-mix(in srgb, var(--primary-color) 7%, var(--ha-card-background, var(--card-background-color)));
                    padding: 10px 8px 12px;
                  }
                  .day.today {
                    box-sizing: border-box;
                    background: color-mix(in srgb, #0d9488 20%, var(--ha-card-background, var(--card-background-color)));
                    box-shadow: inset 0 0 0 2px #0d9488;
                  }
                  .day.saturday,
                  .day.sunday {
                    opacity: 0.88;
                  }
                  .event {
                    border-radius: 10px;
                    border: none;
                  }
                  .event.past {
                    opacity: 0.45;
                  }
                  .number {
                    display: block;
                    font-size: 1.55rem;
                    font-weight: 750;
                    letter-spacing: -0.02em;
                    line-height: 1.1;
                  }
                  .month {
                    display: block;
                    font-size: 0.68rem;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    opacity: 0.65;
                    font-weight: 600;
                    margin-bottom: 4px;
                  }
            card_param: calendars
            filter:
              template: >
                {% set colors = ['#0d9488', '#0284c7', '#d97706', '#7c3aed', '#db2777', '#059669'] %}
                {% set fam = states.calendar
                  | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'planning_family')
                  | list %}
                {% set kids = states.calendar
                  | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'planning')
                  | list %}
                {% set src = fam if fam else kids %}
                {% set ns = namespace(items=[]) %}
                {% for c in src %}
                  {% set name = state_attr(c.entity_id, 'friendly_name')
                    or c.attributes.friendly_name
                    or c.name
                    or 'OptiFamily' %}
                  {% set ns.items = ns.items + [{
                    'entity': c.entity_id,
                    'name': name,
                    'color': colors[loop.index0 % (colors | length)],
                    'icon': 'mdi:baby-carriage' if fam else 'mdi:baby-face-outline'
                  }] %}
                {% endfor %}
                {{ ns.items }}

  # ─── Calendar ──────────────────────────────────────────────────
  - title: Calendar
    path: calendar
    icon: mdi:calendar-month
    type: panel
    cards:
      - type: custom:auto-entities
        show_empty: false
        unique: entity_id
        card:
          type: calendar
          initial_view: dayGridMonth
        card_param: entities
        filter:
          template: >
            {% set fam = states.calendar
              | selectattr('attributes', 'contains', 'optifamily_kind')
              | selectattr('attributes.optifamily_kind', 'eq', 'planning_family')
              | map(attribute='entity_id') | list %}
            {% set kids = states.calendar
              | selectattr('attributes', 'contains', 'optifamily_kind')
              | selectattr('attributes.optifamily_kind', 'eq', 'planning')
              | map(attribute='entity_id') | list %}
            {{ fam if fam else kids }}
