# Tableau de bord OptiFamily — français (panel)
#
# HACS Frontend (requis) : Mushroom, card-mod, auto-entities, mod-card
# Thème : neutre (couleurs Home Assistant par défaut)
#
# Découverte : première config_entry_id via optifamily_kind: phase_journee
# Actions : navigate / call-service / more-info / toggle
# Import : Paramètres → Tableaux de bord → Ajouter → Importer YAML

title: OptiFamily
views:
  - title: Accueil
    path: accueil
    icon: mdi:hand-wave
    type: panel
    cards:
      - type: custom:mod-card
        card_mod:
          style: &panel_mod |
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
              width: 100%;
              max-width: 1100px;
              margin: 0 auto;
              padding: 8px 16px 28px;
            }
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              layout: horizontal
              multiline_secondary: true
              tap_action: {action: none}
              card_mod: &card_plain
                style: |
                  ha-card { border: none; box-shadow: none; }
              icon: >
                {% set s = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                {% set p = s[0].state if s else 'inconnu' %}
                {% if p == 'deposer' %}mdi:car-child-seat
                {% elif p == 'creche' %}mdi:baby-face-outline
                {% elif p == 'chercher' %}mdi:clock-end
                {% elif p == 'rentre' %}mdi:home-import-outline
                {% elif p == 'maison' %}mdi:home-heart
                {% elif p == 'ferme' %}mdi:calendar-remove
                {% else %}mdi:timeline-clock-outline{% endif %}
              primary: >
                {% set s = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                {{ (s[0].attributes.libelle if s else none) or 'OptiFamily' }}
              secondary: >
                {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                {% set resume = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'resume') | list %}
                {% set attn = states.binary_sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'attention') | list %}
                {{ (phase[0].attributes.message if phase else none)
                   or (resume[0].state if resume else none)
                   or 'Intégration introuvable.' }}
                {%- if attn and attn[0].state == 'on' %} · {{ attn[0].attributes.raison or 'Attention' }}{% endif %}

            - type: custom:mushroom-chips-card
              alignment: center
              card_mod: {style: "ha-card { border: none; box-shadow: none; background: transparent; }"}
              chips:
                - type: template
                  icon: >
                    {% set a = states.binary_sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                      | selectattr('attributes.optifamily_kind', 'eq', 'attention') | list %}
                    {{ 'mdi:bell-badge' if a and a[0].state == 'on' else 'mdi:check-circle-outline' }}
                  content: >
                    {% set a = states.binary_sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                      | selectattr('attributes.optifamily_kind', 'eq', 'attention') | list %}
                    {% if a and a[0].state == 'on' %}{{ a[0].attributes.raison or 'Attention' }}
                    {% else %}Tout va bien{% endif %}
                  tap_action: {action: more-info}
                - type: template
                  icon: mdi:text-box-outline
                  content: Envoyer le résumé
                  tap_action: {action: call-service, service: script.optifamily_notify_resume}
                - type: template
                  icon: mdi:clock-check-outline
                  content: >
                    {% set sync = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                      | selectattr('attributes.optifamily_kind', 'eq', 'dernier_rafraichissement') | list %}
                    {% if sync and sync[0].state not in ['unknown', 'unavailable', none] %}
                      {% set sec = (as_timestamp(now()) - as_timestamp(as_datetime(sync[0].state))) | int %}
                      {% if sec < 60 %}À l'instant
                      {% elif sec < 3600 %}Il y a {{ (sec / 60) | int }} min
                      {% elif sec < 86400 %}Il y a {{ (sec / 3600) | int }} h
                      {% else %}Il y a {{ (sec / 86400) | int }} j{% endif %}
                    {% else %}Synchro inconnue{% endif %}
                - type: template
                  icon: mdi:cloud-sync-outline
                  content: Synchroniser
                  tap_action: {action: call-service, service: optifamily.refresh}

            - type: conditional
              conditions:
                - condition: state
                  entity: input_boolean.optifamily_quiet_hours
                  state_not: [unavailable, unknown]
              card:
                type: custom:mushroom-chips-card
                alignment: center
                card_mod: {style: "ha-card { border: none; box-shadow: none; background: transparent; }"}
                chips:
                  - type: template
                    entity: input_boolean.optifamily_quiet_hours
                    icon: "{{ 'mdi:bell-off' if is_state('input_boolean.optifamily_quiet_hours', 'on') else 'mdi:bell-outline' }}"
                    content: "{{ 'Silencieux' if is_state('input_boolean.optifamily_quiet_hours', 'on') else 'Notifications' }}"
                    tap_action: {action: toggle}

            - type: heading
              heading: Enfants du jour
              heading_style: title
              icon: mdi:account-child
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% for s in states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'present') | list
                    if (entry is none or s.attributes.config_entry_id == entry)
                    and states(s.entity_id) not in ['unavailable', 'unknown'] %}
                    {% set ph = s.attributes.phase_enfant or s.state %}
                    {% set ferme = s.attributes.statut_jour == 'ferme' or s.attributes.jour_fermeture %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card',
                      'entity': s.entity_id,
                      'layout': 'horizontal',
                      'multiline_secondary': true,
                      'icon': 'mdi:calendar-remove' if ferme else 'mdi:car-child-seat' if ph == 'deposer'
                        else 'mdi:clock-end' if ph == 'chercher'
                        else 'mdi:home-heart' if ph in ['rentre', 'maison'] or s.state == 'absent'
                        else 'mdi:baby-face-outline',
                      'primary': s.attributes.enfant_libelle or 'Enfant',
                      'secondary': s.attributes.message or s.state,
                      'tap_action': {'action': 'navigate', 'navigation_path': 'enfants'},
                      'card_mod': {'style': plain}
                    }] %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:account-child-outline', 'primary': 'Aucun enfant aujourd’hui', 'secondary': 'Personne suivi ou données pas encore synchronisées.', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

            - type: custom:mushroom-chips-card
              alignment: center
              card_mod: {style: "ha-card { border: none; box-shadow: none; background: transparent; margin-top: 8px; }"}
              chips:
                - type: template
                  icon: mdi:account-child-circle
                  content: Enfants
                  tap_action: {action: navigate, navigation_path: enfants}
                - type: template
                  icon: mdi:calendar-month
                  content: Planning
                  tap_action: {action: navigate, navigation_path: planning}
                - type: template
                  icon: mdi:clipboard-text-clock-outline
                  content: Journal
                  tap_action: {action: navigate, navigation_path: transmissions}
                - type: template
                  icon: mdi:mailbox-outline
                  content: Messages
                  tap_action: {action: navigate, navigation_path: messages}
                - type: template
                  icon: mdi:image-multiple-outline
                  content: Photos
                  tap_action: {action: navigate, navigation_path: medias}
                - type: template
                  icon: mdi:file-document-outline
                  content: Documents
                  tap_action: {action: navigate, navigation_path: medias}
                - type: template
                  icon: mdi:information-outline
                  content: Infos
                  tap_action: {action: navigate, navigation_path: infos}

  - title: Enfants
    path: enfants
    icon: mdi:account-child-circle
    type: panel
    cards:
      - type: custom:mod-card
        card_mod: {style: *panel_mod}
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Fiches
              heading_style: title
              icon: mdi:card-account-details-outline
            - type: custom:auto-entities
              show_empty: true
              card: {type: grid, columns: 2, square: false}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% for s in states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'present') | list
                    if (entry is none or s.attributes.config_entry_id == entry)
                    and states(s.entity_id) not in ['unavailable', 'unknown'] %}
                    {% set id = s.attributes.enfant_id %}
                    {% set tr = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'transmissions')
                      | selectattr('attributes.enfant_id', 'eq', id) | list %}
                    {% set al = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'albums')
                      | selectattr('attributes.enfant_id', 'eq', id) | list %}
                    {% set plages = (s.attributes.plages or []) | map(attribute='label') | list | join(' · ') %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card',
                      'entity': s.entity_id,
                      'layout': 'vertical',
                      'multiline_secondary': true,
                      'icon': 'mdi:baby-face-outline',
                      'primary': s.attributes.enfant_libelle or 'Enfant',
                      'secondary': (s.attributes.message or s.state)
                        ~ ('\n' ~ plages if plages else '')
                        ~ '\n' ~ ((tr[0].state | int(0)) if tr else 0) ~ ' transm. · '
                        ~ ((al[0].state | int(0)) if al else 0) ~ ' album(s)',
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain}
                    }] %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:account-off-outline', 'primary': 'Aucune fiche enfant', 'secondary': 'Vérifiez les enfants suivis dans les options OptiFamily.', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

  - title: Planning
    path: planning
    icon: mdi:calendar-month
    type: panel
    cards:
      - type: custom:auto-entities
        show_empty: true
        card: {type: vertical-stack}
        card_param: cards
        card_mod:
          style: |
            :host { display: block; height: 100%; }
            hui-vertical-stack-card { height: 100%; }
            hui-vertical-stack-card #root { height: 100%; gap: 0; }
            hui-calendar-card { height: 100%; display: block; }
        filter:
          template: >
            {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
              | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
            {% set entry = phase[0].attributes.config_entry_id if phase else none %}
            {% if entry %}
              {% set fam = states.calendar
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'planning_family')
                | selectattr('attributes.config_entry_id', 'eq', entry)
                | map(attribute='entity_id') | list %}
              {% set kids = states.calendar
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'planning')
                | selectattr('attributes.config_entry_id', 'eq', entry)
                | map(attribute='entity_id') | list %}
            {% else %}
              {% set fam = states.calendar
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'planning_family')
                | map(attribute='entity_id') | list %}
              {% set kids = states.calendar
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'planning')
                | map(attribute='entity_id') | list %}
            {% endif %}
            {% set src = fam if fam else kids %}
            {% if src %}
              {{ [{
                'type': 'calendar',
                'initial_view': 'dayGridMonth',
                'entities': src,
                'card_mod': {
                  'style': 'ha-card { height: 100%; display: flex; flex-direction: column; box-sizing: border-box; border: none; box-shadow: none; } ha-full-calendar { flex: 1 1 auto; height: 100%; --calendar-height: calc(100vh - var(--header-height, 56px) - 24px); min-height: var(--calendar-height); }'
                }
              }] }}
            {% else %}
              {{ [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:calendar-blank-outline', 'primary': 'Aucun planning disponible', 'secondary': 'Synchronisez OptiFamily ou vérifiez les enfants suivis.', 'tap_action': {'action': 'none'}, 'card_mod': {'style': 'ha-card { border: none; box-shadow: none; }'}}] }}
            {% endif %}

  - title: Transmissions
    path: transmissions
    icon: mdi:clipboard-text-clock-outline
    type: panel
    cards:
      - type: custom:mod-card
        card_mod: {style: *panel_mod}
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Journal
              heading_style: title
              icon: mdi:book-open-page-variant-outline
            - type: custom:mushroom-chips-card
              alignment: center
              card_mod: {style: "ha-card { border: none; box-shadow: none; background: transparent; }"}
              chips:
                - type: template
                  icon: mdi:chevron-left
                  content: Jour précédent
                  tap_action: {action: call-service, service: optifamily.shift_transmissions_date, data: {days: -1}}
                - type: template
                  icon: mdi:calendar-today
                  content: >
                    {% set j = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                      | selectattr('attributes.optifamily_kind', 'eq', 'transmissions_journal') | list %}
                    {{ (j[0].attributes.date if j else none) or now().date().isoformat() }}
                  tap_action: {action: call-service, service: optifamily.set_transmissions_date, data: {date: "{{ now().date().isoformat() }}"}}
                - type: template
                  icon: mdi:chevron-right
                  content: Jour suivant
                  tap_action: {action: call-service, service: optifamily.shift_transmissions_date, data: {days: 1}}
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% for s in states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'transmissions_journal') | list
                    if (entry is none or s.attributes.config_entry_id == entry)
                    and states(s.entity_id) not in ['unavailable', 'unknown'] %}
                    {% set n = states(s.entity_id) | int(0) %}
                    {% set raw = state_attr(s.entity_id, 'items') or [] %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card',
                      'entity': s.entity_id,
                      'icon': 'mdi:clipboard-text-clock-outline',
                      'primary': (s.attributes.enfant_libelle or 'Enfant') ~ ' · ' ~ n,
                      'secondary': (s.attributes.date or '') ~ ('\nAucune transmission pour cette date.' if n == 0 else ''),
                      'multiline_secondary': true,
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain}
                    }] %}
                    {% for item in raw[:20] %}
                      {% set ns.out = ns.out + [{
                        'type': 'custom:mushroom-template-card',
                        'entity': s.entity_id,
                        'icon': item.icon if item.icon else 'mdi:clipboard-text-outline',
                        'primary': (item.titre if item.titre else 'Transmission') ~ (' ★' if item.marquant else ''),
                        'secondary': item.bloc if item.bloc else (item.ligne if item.ligne else ''),
                        'multiline_secondary': true,
                        'layout': 'horizontal',
                        'tap_action': {'action': 'more-info'},
                        'card_mod': {'style': plain}
                      }] %}
                    {% endfor %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:clipboard-text-off-outline', 'primary': 'Aucune transmission', 'secondary': 'Rien pour cette date, ou données pas encore synchronisées.', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

  - title: Messages
    path: messages
    icon: mdi:mailbox-outline
    type: panel
    cards:
      - type: custom:mod-card
        card_mod: {style: *panel_mod}
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Messages
              heading_style: title
              icon: mdi:forum-outline
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% set msgs = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'messages') | list %}
                  {% for s in msgs if entry is none or s.attributes.config_entry_id == entry %}
                    {% set n = states(s.entity_id) | int(0) %}
                    {% set non_lus = s.attributes.non_lus | int(0) %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card', 'entity': s.entity_id,
                      'icon': 'mdi:forum-outline',
                      'primary': n ~ ' message(s)' ~ (' · ' ~ non_lus ~ ' non lu(s)' if non_lus else ''),
                      'secondary': 'Fil de discussion (vous ↔ crèche)',
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain},
                    }] %}
                    {% for item in (s.attributes.items or [])[:40] %}
                      {% set from_me = item.sender if item.sender is defined else false %}
                      {% set unread = (item.vu is defined and not item.vu) %}
                      {% set ns.out = ns.out + [{
                        'type': 'custom:mushroom-template-card', 'entity': s.entity_id,
                        'layout': 'horizontal', 'multiline_secondary': true,
                        'icon': 'mdi:account-arrow-right' if from_me else 'mdi:town-hall',
                        'primary': (item.origine or ('Vous' if from_me else 'Crèche'))
                          ~ (' · non lu' if unread else ''),
                        'secondary': (item.date or '') ~ ('\n' ~ (item.corps or item.message or item.body or item.texte or '')),
                        'tap_action': {'action': 'more-info'},
                        'card_mod': {'style': plain},
                      }] %}
                    {% endfor %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:mailbox-outline', 'primary': 'Aucun message', 'secondary': 'La conversation avec la crèche apparaîtra ici.', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

  - title: Médias
    path: medias
    icon: mdi:folder-multiple-image
    type: panel
    cards:
      - type: custom:mod-card
        card_mod: {style: *panel_mod}
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Albums / photos
              heading_style: title
              icon: mdi:image-album
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% for s in states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'albums') | list
                    if entry is none or s.attributes.config_entry_id == entry %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card',
                      'entity': s.entity_id,
                      'icon': 'mdi:image-multiple-outline',
                      'primary': (s.attributes.enfant_libelle or 'Enfant') ~ ' · ' ~ (states(s.entity_id) | int(0)) ~ ' album(s)',
                      'secondary': 'Détail capteur',
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain},
                    }] %}
                    {% for album in (s.attributes.items or [])[:6] %}
                      {% set photos = album.photos or album.items or [] %}
                      {% set ns.out = ns.out + [{
                        'type': 'custom:mushroom-template-card',
                        'entity': s.entity_id,
                        'icon': 'mdi:folder-image',
                        'primary': album.titre or album.label or album.nom or 'Album',
                        'secondary': (photos | length) ~ ' photo(s)',
                        'tap_action': {'action': 'more-info'},
                        'card_mod': {'style': plain},
                      }] %}
                      {% for photo in photos[:10] %}
                        {% set can = photo.downloadable if photo.downloadable is defined else true %}
                        {% set pid = photo.id if photo.id is defined else none %}
                        {% set ns.out = ns.out + [{
                          'type': 'custom:mushroom-template-card',
                          'entity': s.entity_id,
                          'layout': 'horizontal',
                          'icon': 'mdi:image-outline' if can else 'mdi:image-off-outline',
                          'primary': photo.titre or photo.label or ('Photo ' ~ (pid or '')),
                          'secondary': 'Appeler téléchargement' if can and pid else 'Non téléchargeable',
                          'tap_action': (
                            {'action': 'call-service', 'service': 'optifamily.download',
                             'data': {'kind': 'photo', 'id': pid, 'enfant_id': s.attributes.enfant_id,
                                      'config_entry_id': s.attributes.config_entry_id}}
                            if can and pid else {'action': 'more-info'}
                          ),
                          'card_mod': {'style': plain},
                        }] %}
                      {% endfor %}
                    {% endfor %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:image-off-outline', 'primary': 'Aucun album', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

            - type: heading
              heading: Documents
              heading_style: title
              icon: mdi:folder-open-outline
            - type: custom:mushroom-chips-card
              alignment: center
              card_mod: {style: "ha-card { border: none; box-shadow: none; background: transparent; }"}
              chips:
                - type: template
                  icon: mdi:town-hall
                  content: Portée crèche
                  tap_action: {action: call-service, service: optifamily.set_documents_scope, data: {scope: creche}}
                - type: template
                  icon: mdi:account-group-outline
                  content: Portée famille
                  tap_action: {action: call-service, service: optifamily.set_documents_scope, data: {scope: famille}}
                - type: template
                  icon: mdi:baby-face-outline
                  content: Portée enfant
                  tap_action: {action: call-service, service: optifamily.set_documents_scope, data: {scope: enfant}}
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set docs = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'documents') | list %}
                  {% if not docs %}
                    {% set docs = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                      | selectattr('attributes.optifamily_kind', 'eq', 'documents_total') | list %}
                  {% endif %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% for s in docs if entry is none or s.attributes.config_entry_id == entry %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card',
                      'entity': s.entity_id,
                      'icon': 'mdi:file-document-outline',
                      'primary': 'Documents · ' ~ (states(s.entity_id) | int(0)),
                      'secondary': 'Portée : ' ~ (s.attributes.scope or '—'),
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain},
                    }] %}
                    {% for item in (s.attributes.items or [])[:20] %}
                      {% set can = item.downloadable if item.downloadable is defined else true %}
                      {% set iid = item.id if item.id is defined else none %}
                      {% set ns.out = ns.out + [{
                        'type': 'custom:mushroom-template-card',
                        'entity': s.entity_id,
                        'layout': 'horizontal',
                        'icon': 'mdi:file-download-outline' if can else 'mdi:file-outline',
                        'primary': item.titre or item.label or item.nom or 'Document',
                        'secondary': ('Appeler téléchargement · ' if can and iid else 'Non téléchargeable · ') ~ (item.date or ''),
                        'tap_action': (
                          {'action': 'call-service', 'service': 'optifamily.download',
                           'data': {'kind': 'document', 'id': iid, 'config_entry_id': s.attributes.config_entry_id}}
                          if can and iid else {'action': 'more-info'}
                        ),
                        'card_mod': {'style': plain},
                      }] %}
                    {% endfor %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:file-document-remove-outline', 'primary': 'Aucun document', 'secondary': 'Changez la portée ci-dessus.', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

  - title: Infos
    path: infos
    icon: mdi:information-outline
    type: panel
    cards:
      - type: custom:mod-card
        card_mod: {style: *panel_mod}
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: La crèche
              heading_style: title
              icon: mdi:town-hall
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% set creches = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'creche') | list %}
                  {% for s in creches if entry is none or s.attributes.config_entry_id == entry %}
                    {% set nom = s.attributes.nom or states(s.entity_id) or 'Crèche' %}
                    {% set adresse = s.attributes.adresse or '' %}
                    {% set tel = s.attributes.telephone or '' %}
                    {% set mail = s.attributes.email or '' %}
                    {% set desc = s.attributes.description or '' %}
                    {% set n_collab = s.attributes.collaborateurs_count | int(0) %}
                    {% set n_photos = s.attributes.photos_count | int(0) %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card',
                      'entity': s.entity_id,
                      'layout': 'horizontal',
                      'multiline_secondary': true,
                      'icon': 'mdi:town-hall',
                      'primary': nom if nom not in ['unknown', 'unavailable', '—', ''] else 'Crèche',
                      'secondary': (adresse if adresse else 'Adresse non renseignée')
                        ~ ('\n' ~ tel if tel else '')
                        ~ ('\n' ~ mail if mail else '')
                        ~ ('\n' ~ desc if desc else '')
                        ~ ('\n' ~ n_collab ~ ' collaborateur(s)' if n_collab else '')
                        ~ (' · ' ~ n_photos ~ ' photo(s)' if n_photos else ''),
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain},
                    }] %}
                    {% for c in (s.attributes.collaborateurs or [])[:15] %}
                      {% set ns.out = ns.out + [{
                        'type': 'custom:mushroom-template-card',
                        'entity': s.entity_id,
                        'layout': 'horizontal',
                        'icon': 'mdi:account-outline',
                        'primary': c.nom or c.name or c.libelle or 'Collaborateur',
                        'secondary': c.fonction or c.role or c.email or '',
                        'tap_action': {'action': 'more-info'},
                        'card_mod': {'style': plain},
                      }] %}
                    {% endfor %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:information-off-outline', 'primary': 'Infos crèche indisponibles', 'secondary': 'Synchronisez OptiFamily pour charger la fiche.', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

            - type: heading
              heading: Actualités
              heading_style: title
              icon: mdi:newspaper-variant-outline
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% for s in states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'actualites_total') | list
                    if entry is none or s.attributes.config_entry_id == entry %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card', 'entity': s.entity_id,
                      'icon': 'mdi:newspaper-variant-outline',
                      'primary': (states(s.entity_id) | int(0)) ~ ' actualité(s)',
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain},
                    }] %}
                    {% for item in (s.attributes.items or [])[:15] %}
                      {% set ns.out = ns.out + [{
                        'type': 'custom:mushroom-template-card', 'entity': s.entity_id,
                        'layout': 'horizontal', 'multiline_secondary': true,
                        'icon': 'mdi:newspaper',
                        'primary': item.titre or item.title or 'Actualité',
                        'secondary': (item.date or '') ~ ('\n' ~ (item.resume or item.texte or item.texte_court or item.body or '')),
                        'tap_action': {'action': 'more-info'},
                        'card_mod': {'style': plain},
                      }] %}
                    {% endfor %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:newspaper-remove', 'primary': 'Aucune actualité', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}

            - type: heading
              heading: Factures
              heading_style: title
              icon: mdi:receipt-text-outline
            - type: custom:auto-entities
              show_empty: true
              card: {type: vertical-stack}
              card_param: cards
              filter:
                template: >
                  {% set phase = states.sensor | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee') | list %}
                  {% set entry = phase[0].attributes.config_entry_id if phase else none %}
                  {% set ns = namespace(out=[]) %}
                  {% set plain = 'ha-card { border: none; box-shadow: none; }' %}
                  {% for s in states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'facturation_total') | list
                    if entry is none or s.attributes.config_entry_id == entry %}
                    {% set ns.out = ns.out + [{
                      'type': 'custom:mushroom-template-card', 'entity': s.entity_id,
                      'icon': 'mdi:receipt-text-outline',
                      'primary': (states(s.entity_id) | int(0)) ~ ' facture(s)',
                      'tap_action': {'action': 'more-info'},
                      'card_mod': {'style': plain},
                    }] %}
                    {% for item in (s.attributes.items or [])[:15] %}
                      {% set can = item.downloadable if item.downloadable is defined else true %}
                      {% set iid = item.id if item.id is defined else none %}
                      {% set ns.out = ns.out + [{
                        'type': 'custom:mushroom-template-card', 'entity': s.entity_id,
                        'layout': 'horizontal',
                        'icon': 'mdi:download' if can else 'mdi:receipt',
                        'primary': item.libelle or item.titre or item.label or 'Facture',
                        'secondary': ('Appeler téléchargement · ' if can and iid else 'Non téléchargeable · ')
                          ~ (item.montant or '') ~ (' · ' if item.montant and item.date else '') ~ (item.date or ''),
                        'tap_action': (
                          {'action': 'call-service', 'service': 'optifamily.download',
                           'data': {'kind': 'facture', 'id': iid, 'config_entry_id': s.attributes.config_entry_id}}
                          if can and iid else {'action': 'more-info'}
                        ),
                        'card_mod': {'style': plain},
                      }] %}
                    {% endfor %}
                  {% endfor %}
                  {{ ns.out if ns.out else [{'type': 'custom:mushroom-template-card', 'icon': 'mdi:receipt-text-remove', 'primary': 'Aucune facture', 'tap_action': {'action': 'none'}, 'card_mod': {'style': plain}}] }}
