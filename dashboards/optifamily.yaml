# Dashboard OptiFamily — vue simple
#
# Pour une version plus riche (vues Aujourd'hui / Détail / Historique,
# cartes conditionnelles, résumé Jinja) : voir optifamily_avance.yaml

title: OptiFamily
views:
  - title: OptiFamily
    path: optifamily
    icon: mdi:baby-face-outline
    cards:
      - type: markdown
        content: >
          **OptiFamily** — remplacez les entity_id par ceux de votre instance
          (Outils de développement → États, filtre `optifamily`).

      - type: glance
        title: Compte
        entities:
          - entity: sensor.optifamily_enfants
            name: Enfants
          - entity: sensor.optifamily_enfants_en_creche_aujourd_hui
            name: En crèche
          - entity: sensor.optifamily_messages_non_lus_creche
            name: Msg crèche
          - entity: sensor.optifamily_messages_non_lus_moi
            name: Msg moi
          - entity: sensor.optifamily_actualites
            name: Actualités

      - type: markdown
        content: |
          {% set liste = state_attr('sensor.optifamily_enfants', 'liste') or [] %}
          {% for e in liste %}
          **{{ e.libelle }}** — {{ e.presence }}
          {% if e.creneaux %} · {{ e.creneaux | join(', ') }}{% endif %}
          · {{ e.transmissions }} transmission(s)

          {% else %}
          *Aucun enfant détecté.*
          {% endfor %}
