# Tableau de bord OptiFamily — français
#
# Import : Paramètres → Tableaux de bord → Ajouter → Importer YAML
# Les cartes retrouvent les capteurs via `optifamily_kind`.
# Calendrier : calendar.optifamily_planning

title: OptiFamily
views:
  - title: Famille
    path: famille
    icon: mdi:baby-face-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aujourd'hui
            heading_style: title
            icon: mdi:white-balance-sunny
          - type: markdown
            content: |
              {% set _j = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'] %}
              {% set _m = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] %}
              {% set enfants_s = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
              {% set liste = (enfants_s[0].attributes.liste if enfants_s else []) or [] %}
              {% set presents = liste | selectattr('presence', 'equalto', 'présent') | list %}
              {% set msg_c = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
              {% set msg_m = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_me') | list %}
              {% set nc = (msg_c[0].state | int(0)) if msg_c else 0 %}
              {% set nm = (msg_m[0].state | int(0)) if msg_m else 0 %}
              {% set sync = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'dernier_rafraichissement') | list %}

              ### {{ _j[now().weekday()] | capitalize }} {{ now().day }} {{ _m[now().month - 1] }} {{ now().year }}

              {% if liste | length == 0 %}
              *Intégration OptiFamily introuvable ou aucun enfant.*
              {% elif presents | length == liste | length and liste | length > 0 %}
              Toute la fratrie est **en crèche** aujourd'hui.
              {% elif presents | length == 0 %}
              Personne n'est prévu en crèche aujourd'hui.
              {% else %}
              **{{ presents | length }}** / **{{ liste | length }}** en crèche
              — {{ presents | map(attribute='libelle') | join(', ') }}
              {% endif %}

              {% if nc > 0 or nm > 0 %}

              ---
              {% if nc > 0 %}Message{{ 's' if nc > 1 }} de la crèche : **{{ nc }}** non lu{{ 's' if nc > 1 }}{% endif %}
              {% if nc > 0 and nm > 0 %} · {% endif %}
              {% if nm > 0 %}Envoyé{{ 's' if nm > 1 }} non lu{{ 's' if nm > 1 }} : **{{ nm }}**{% endif %}
              {% endif %}
              {% if sync %}

              *Màj {{ relative_time(as_datetime(sync[0].state)) if sync[0].state not in ['unknown', 'unavailable', none] else '—'}} · toutes les {{ sync[0].attributes.intervalle_minutes | default('?') }} min*
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Enfants
            heading_style: title
            icon: mdi:human-male-female-child
          - type: markdown
            content: |
              {% set enfants_s = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
              {% set liste = (enfants_s[0].attributes.liste if enfants_s else []) or [] %}
              {% if liste | length == 0 %}
              *Aucun enfant détecté.*
              {% else %}
              {% for e in liste %}
              {% if not loop.first %}

              ---
              {% endif %}
              ### {% if e.presence == 'présent' %}🟢{% elif e.presence == 'absent' %}⚪{% else %}❓{% endif %} {{ e.libelle }}

              **{{ e.presence | capitalize }}**{% if e.creneaux %} · {{ e.creneaux | join(' · ') }}{% endif %}
              {% set extras = (e.creneaux_detail or []) | rejectattr('type', 'equalto', 'regulier') | list %}
              {% if extras %}

              {% for c in extras %}
              _{% if c.type == 'fermeture' %}Fermeture{% else %}{{ c.type }}{% endif %}{% if c.label %} — {{ c.label }}{% endif %}{% if c.details %} ({{ c.details }}){% endif %}_
              {% endfor %}
              {% endif %}

              | Transmissions | Albums | Créneaux ce mois |
              | :---: | :---: | :---: |
              | {{ e.transmissions | default(0) }} | {{ e.albums | default(0) }} | {{ e.creneaux_mois | default(0) }} |
              {% endfor %}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Messages
            heading_style: title
            icon: mdi:message-text-outline
          - type: markdown
            content: |
              {% set msg_c = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
              {% set msg_m = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_me') | list %}
              {% set c = msg_c[0] if msg_c else none %}
              {% set m = msg_m[0] if msg_m else none %}
              {% set nc = c.state | int(0) if c else 0 %}
              {% set nm = m.state | int(0) if m else 0 %}

              {% if not c and not m %}
              *Capteurs messages introuvables.*
              {% elif nc == 0 and nm == 0 %}
              Aucun message en attente.
              {% else %}
              {% if nc > 0 %}
              #### De la crèche
              **{{ nc }}** non lu{{ 's' if nc > 1 }} / {{ c.attributes.total | default('?') }} au total
              {% set d = as_datetime(c.attributes.last_unread_date) if c.attributes.last_unread_date else none %}
              {% if d %}Dernier : {{ d.strftime('%d/%m à %H:%M') }}{% endif %}
              {% endif %}
              {% if nm > 0 %}
              #### Envoyés (moi)
              **{{ nm }}** encore non lu{{ 's' if nm > 1 }} / {{ m.attributes.total | default('?') }} au total
              {% set d = as_datetime(m.attributes.last_unread_date) if m.attributes.last_unread_date else none %}
              {% if d %}Dernier : {{ d.strftime('%d/%m à %H:%M') }}{% endif %}
              {% endif %}
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Compte
            heading_style: title
            icon: mdi:office-building-outline
          - type: markdown
            content: |
              {% set actus = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'actualites_total') | list %}
              {% set docs = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'documents_total') | list %}
              {% set fact = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'facturation_total') | list %}
              {% set sync = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'dernier_rafraichissement') | list %}

              | Actualités | Documents | Factures |
              | :---: | :---: | :---: |
              | {{ actus[0].state if actus else '—' }} | {{ docs[0].state if docs else '—' }} | {{ fact[0].state if fact else '—' }} |

              {% if sync and sync[0].state not in ['unknown', 'unavailable', none] %}
              Dernier rafraîchissement : **{{ as_datetime(sync[0].state).strftime('%d/%m à %H:%M') }}**
              (toutes les **{{ sync[0].attributes.intervalle_minutes | default('?') }}** min)
              {% endif %}

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 7 prochains jours
            heading_style: title
            icon: mdi:calendar-week
          - type: markdown
            content: |
              {% set _j = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'] %}
              {% set slots = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'planning_slots') | list %}
              {% set start = now().replace(hour=0, minute=0, second=0, microsecond=0) %}
              {% set end = start + timedelta(days=7) %}
              {% if slots | length == 0 %}
              *Planning du mois non disponible.*
              {% else %}
              {% for s in slots %}
              **{{ s.attributes.enfant_libelle or s.name }}**
              {% set rows = namespace(n=0) %}
              {% for j in s.attributes.jours or [] %}
              {% set jd = as_datetime(j.date) if j.date else none %}
              {% if jd and jd >= start and jd < end %}
              {% set rows.n = rows.n + 1 %}
              - **{{ _j[jd.weekday()] }} {{ jd.strftime('%d/%m') }}** — {{ j.creneaux | join(' · ') }}
              {% endif %}
              {% endfor %}
              {% if rows.n == 0 %}
              _Aucun créneau sur 7 jours._
              {% endif %}

              {% endfor %}
              {% endif %}

  - title: Planning
    path: planning
    icon: mdi:calendar-month
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Calendrier
            heading_style: title
            icon: mdi:calendar-clock
          - type: calendar
            initial_view: dayGridMonth
            entities:
              - calendar.optifamily_planning
          - type: markdown
            content: |
              Flèches du calendrier = changement de mois (1 appel API par mois, puis cache).
              {% set cals = states.calendar | selectattr('attributes.optifamily_kind', 'eq', 'planning') | list %}
              {% if cals %}
              Par enfant : {{ cals | map(attribute='entity_id') | join(', ') }}
              {% endif %}

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Mois affiché par l'API
            heading_style: title
            icon: mdi:calendar-text
          - type: markdown
            content: |
              {% set _j = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'] %}
              {% set slots = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'planning_slots') | list %}
              {% if slots | length == 0 %}
              *Aucun planning chargé.*
              {% else %}
              {% for s in slots %}
              ### {{ s.attributes.enfant_libelle or s.name }}
              {{ s.attributes.label or '' }}
              {% if s.attributes.previous or s.attributes.next %}
              {{ s.attributes.previous or '—' }} ← → {{ s.attributes.next or '—' }}
              {% endif %}

              {% for j in s.attributes.jours or [] %}
              {% set jd = as_datetime(j.date) if j.date else none %}
              - {% if jd %}**{{ _j[jd.weekday()] }} {{ jd.strftime('%d/%m') }}**{% else %}{{ j.date }}{% endif %} — {{ j.creneaux | join(' · ') }}
              {% endfor %}
              {% if (s.attributes.jours or []) | length == 0 %}
              _Pas de créneau ce mois-ci._
              {% endif %}

              {% endfor %}
              {% endif %}
