# Tableau de bord OptiFamily — français
#
# HACS Frontend (manuel) : Mushroom, card-mod, auto-entities, week-planner-card
# Import : Paramètres → Tableaux de bord → Ajouter → Importer YAML
# Les cartes retrouvent les capteurs via l’attribut optifamily_kind.

title: OptiFamily
views:
  # ─── Aujourd’hui ───────────────────────────────────────────────
  - title: Aujourd’hui
    path: aujourdhui
    icon: mdi:hand-wave
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-template-card
            layout: horizontal
            multiline_secondary: true
            tap_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  border-radius: 28px;
                  border: none;
                  box-shadow: none;
                  padding: 4px 2px;
                  background: linear-gradient(
                    125deg,
                    rgba(245,158,11,.26) 0%,
                    rgba(13,148,136,.20) 48%,
                    rgba(59,130,246,.12) 100%
                  );
                }
            icon: >
              {% set h = now().hour %}
              {% if h < 6 %}mdi:weather-night
              {% elif h < 12 %}mdi:weather-sunset-up
              {% elif h < 18 %}mdi:white-balance-sunny
              {% else %}mdi:weather-sunset
              {% endif %}
            icon_color: >
              {% set h = now().hour %}
              {% if h < 6 %}indigo
              {% elif h < 12 %}amber
              {% elif h < 18 %}orange
              {% else %}deep-orange
              {% endif %}
            primary: >
              {% set h = now().hour %}
              {% set j = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'] %}
              {% set m = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] %}
              {% if h < 6 %}Bonne nuit
              {% elif h < 12 %}Bonjour
              {% elif h < 18 %}Bon après-midi
              {% else %}Bonsoir
              {% endif %} · {{ j[now().weekday()] }} {{ now().day }} {{ m[now().month - 1] }}
            secondary: >
              {% set s = states.sensor
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
              {% set liste = (s[0].attributes.liste if s else []) or [] %}
              {% set presents = liste | selectattr('presence', 'equalto', 'présent') | list %}
              {% set n = liste | length %}
              {% if n == 0 %}Intégration introuvable ou aucun enfant configuré.
              {% elif presents | length == 0 %}
                {% if n == 1 %}{{ liste[0].libelle }} est à la maison aujourd’hui.
                {% else %}Journée à la maison — personne en crèche.
                {% endif %}
              {% else %}
                {% set ns = namespace(drop=none, pick=none, mid=[], done=[]) %}
                {% for e in presents %}
                  {% set label = (e.creneaux[0] if e.creneaux else '') %}
                  {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                  {% if times | length >= 2 %}
                    {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                    {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                    {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                    {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                    {% if to_start > 0 %}
                      {% if ns.drop is none or to_start < ns.drop.mins %}
                        {% set ns.drop = {'name': e.libelle, 'mins': to_start, 'at': times[0][0] ~ ':' ~ times[0][1]} %}
                      {% endif %}
                    {% elif to_end > 0 %}
                      {% set ns.mid = ns.mid + [e.libelle] %}
                      {% if ns.pick is none or to_end < ns.pick.mins %}
                        {% set ns.pick = {'name': e.libelle, 'mins': to_end, 'at': times[1][0] ~ ':' ~ times[1][1]} %}
                      {% endif %}
                    {% else %}
                      {% set ns.done = ns.done + [e.libelle] %}
                    {% endif %}
                  {% else %}
                    {% set ns.mid = ns.mid + [e.libelle] %}
                  {% endif %}
                {% endfor %}
                {% if ns.drop %}
                  {% set m = ns.drop.mins %}
                  {% if m > 90 %}Allez déposer {{ ns.drop.name }} à {{ ns.drop.at }}.
                  {% elif m >= 60 %}Allez déposer {{ ns.drop.name }} dans {{ m // 60 }} h{% if m % 60 %} {{ m % 60 }} min{% endif %}.
                  {% else %}Allez déposer {{ ns.drop.name }} dans {{ m }} min.
                  {% endif %}
                {% elif ns.pick and ns.pick.mins <= 90 %}
                  {% set m = ns.pick.mins %}
                  {% if m >= 60 %}Allez chercher {{ ns.pick.name }} dans {{ m // 60 }} h{% if m % 60 %} {{ m % 60 }} min{% endif %}.
                  {% else %}Allez chercher {{ ns.pick.name }} dans {{ m }} min.
                  {% endif %}
                {% elif ns.mid %}
                  {{ ns.mid | join(', ') }} en crèche{% if ns.pick %} · récupération à {{ ns.pick.at }}{% endif %}.
                {% elif ns.done | length == 1 %}
                  {{ ns.done[0] }} est rentré·e.
                {% elif ns.done %}
                  Tout le monde est rentré.
                {% else %}
                  {{ presents | map(attribute='libelle') | join(', ') }} en crèche.
                {% endif %}
              {% endif %}

      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  border: none;
                  box-shadow: none;
                  background: transparent;
                }
            chips:
              - type: template
                icon: mdi:baby-carriage
                icon_color: >
                  {% set p = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'enfants_presents') | list %}
                  {{ 'teal' if p and p[0].state | int(0) > 0 else 'blue-grey' }}
                content: >
                  {% set p = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'enfants_presents') | list %}
                  {% set n = (p[0].state | int(0)) if p else 0 %}
                  {% if n == 0 %}Aucun en crèche
                  {% elif n == 1 %}1 en crèche
                  {% else %}{{ n }} en crèche
                  {% endif %}
              - type: template
                icon: >
                  {% set m = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
                  {% set n = (m[0].state | int(0)) if m else 0 %}
                  {{ 'mdi:mailbox-open' if n > 0 else 'mdi:mailbox-outline' }}
                icon_color: >
                  {% set m = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
                  {{ 'red' if m and m[0].state | int(0) > 0 else 'teal' }}
                content: >
                  {% set m = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
                  {% set n = (m[0].state | int(0)) if m else 0 %}
                  {% if n == 0 %}Boîte à jour
                  {% else %}{{ n }} message{{ 's' if n != 1 }} crèche
                  {% endif %}
              - type: template
                icon: mdi:clock-check-outline
                icon_color: cyan
                content: >
                  {% set sync = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'dernier_rafraichissement') | list %}
                  {% if sync and sync[0].state not in ['unknown', 'unavailable', none] %}
                    Mis à jour {{ relative_time(as_datetime(sync[0].state)) }}
                  {% else %}Synchro inconnue
                  {% endif %}

      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.optifamily_quiet_hours
                state_not:
                  - unavailable
                  - unknown
            card:
              type: custom:mushroom-chips-card
              alignment: center
              card_mod:
                style: |
                  ha-card {
                    border: none;
                    box-shadow: none;
                    background: transparent;
                  }
              chips:
                - type: template
                  entity: sensor.optifamily_phase_journee
                  icon: >
                    {% set p = states('sensor.optifamily_phase_journee') %}
                    {% if p == 'deposer' %}mdi:car-child-seat
                    {% elif p == 'creche' %}mdi:baby-face-outline
                    {% elif p == 'chercher' %}mdi:clock-end
                    {% elif p == 'rentre' %}mdi:home-import-outline
                    {% elif p == 'maison' %}mdi:home-heart
                    {% else %}mdi:timeline-clock-outline
                    {% endif %}
                  icon_color: >
                    {% set p = states('sensor.optifamily_phase_journee') %}
                    {% if p == 'deposer' %}amber
                    {% elif p == 'creche' %}teal
                    {% elif p == 'chercher' %}orange
                    {% elif p == 'rentre' or p == 'maison' %}blue-grey
                    {% else %}cyan
                    {% endif %}
                  content: >
                    {% set p = states('sensor.optifamily_phase_journee') %}
                    {{ state_attr('sensor.optifamily_phase_journee', 'libelle') or p }}
                    {%- set mins = state_attr('sensor.optifamily_phase_journee', 'minutes') -%}
                    {%- if mins is not none and mins | int(-1) >= 0 and p in ['deposer', 'chercher'] %} · {{ mins }} min{% endif %}
                  tap_action:
                    action: more-info
                - type: template
                  entity: input_boolean.optifamily_quiet_hours
                  icon: "{{ 'mdi:bell-off' if is_state('input_boolean.optifamily_quiet_hours', 'on') else 'mdi:bell-outline' }}"
                  icon_color: "{{ 'deep-orange' if is_state('input_boolean.optifamily_quiet_hours', 'on') else 'teal' }}"
                  content: "{{ 'Silencieux' if is_state('input_boolean.optifamily_quiet_hours', 'on') else 'Notifications' }}"
                  tap_action:
                    action: toggle
                - type: template
                  entity: binary_sensor.optifamily_attention
                  icon: "{{ 'mdi:bell-badge' if is_state('binary_sensor.optifamily_attention', 'on') else 'mdi:check-circle-outline' }}"
                  icon_color: "{{ 'red' if is_state('binary_sensor.optifamily_attention', 'on') else 'teal' }}"
                  content: >
                    {% if is_state('binary_sensor.optifamily_attention', 'on') %}
                      {{ state_attr('binary_sensor.optifamily_attention', 'raison') or 'Attention' }}
                    {% else %}Tout va bien
                    {% endif %}
                  tap_action:
                    action: more-info
                - type: template
                  entity: script.optifamily_notify_resume
                  icon: mdi:text-box-outline
                  icon_color: cyan
                  content: Résumé
                  tap_action:
                    action: call-service
                    service: script.optifamily_notify_resume

      - type: grid
        cards:
          - type: heading
            heading: Présence du jour
            heading_style: title
            icon: mdi:account-child
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            sort:
              method: attribute
              attribute: enfant_libelle
            card:
              type: vertical-stack
            card_param: cards
            filter:
              exclude:
                - state: unavailable
              include:
                - attributes:
                    optifamily_kind: present
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    layout: horizontal
                    multiline_secondary: true
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 22px;
                          border: none;
                          box-shadow: none;
                        }
                    icon: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}mdi:home-heart
                      {% elif st != 'présent' %}mdi:help-circle-outline
                      {% elif times | length < 2 %}mdi:baby-face-outline
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}mdi:car-child-seat
                        {% elif to_end > 90 %}mdi:baby-face-outline
                        {% elif to_end > 0 %}mdi:clock-end
                        {% else %}mdi:home-import-outline
                        {% endif %}
                      {% endif %}
                    icon_color: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}blue-grey
                      {% elif st != 'présent' %}amber
                      {% elif times | length < 2 %}teal
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}amber
                        {% elif to_end > 90 %}teal
                        {% elif to_end > 0 %}orange
                        {% else %}blue-grey
                        {% endif %}
                      {% endif %}
                    badge_icon: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}mdi:home
                      {% elif st != 'présent' %}mdi:alert-circle-outline
                      {% elif times | length < 2 %}mdi:check-circle
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}mdi:arrow-right-bold-circle
                        {% elif to_end > 90 %}mdi:check-circle
                        {% elif to_end > 0 %}mdi:bell-ring
                        {% else %}mdi:home
                        {% endif %}
                      {% endif %}
                    badge_color: >
                      {% set st = states(entity) %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}grey
                      {% elif st != 'présent' %}amber
                      {% elif times | length < 2 %}teal
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 0 %}amber
                        {% elif to_end > 90 %}teal
                        {% elif to_end > 0 %}orange
                        {% else %}grey
                        {% endif %}
                      {% endif %}
                    primary: "{{ state_attr(entity, 'enfant_libelle') }}"
                    secondary: >
                      {% set st = states(entity) %}
                      {% set name = state_attr(entity, 'enfant_libelle') %}
                      {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                      {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                      {% if st == 'absent' %}{{ name }} est à la maison
                      {% elif st != 'présent' %}Présence non confirmée
                      {% elif times | length < 2 %}{{ name }} est en crèche
                      {% else %}
                        {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                        {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                        {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                        {% if to_start > 90 %}Allez déposer {{ name }} à {{ times[0][0] }}:{{ times[0][1] }}
                        {% elif to_start > 0 %}Allez déposer {{ name }} {% if to_start >= 60 %}dans {{ to_start // 60 }} h{% if to_start % 60 %} {{ to_start % 60 }} min{% endif %}{% else %}dans {{ to_start }} min{% endif %}
                        {% elif to_end > 90 %}En crèche · allez chercher à {{ times[1][0] }}:{{ times[1][1] }}
                        {% elif to_end > 0 %}Allez chercher {{ name }} {% if to_end >= 60 %}dans {{ to_end // 60 }} h{% if to_end % 60 %} {{ to_end % 60 }} min{% endif %}{% else %}dans {{ to_end }} min{% endif %}
                        {% else %}{{ name }} est rentré·e
                        {% endif %}
                      {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Boîte aux lettres
            heading_style: title
            icon: mdi:mailbox-outline
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - attributes:
                    optifamily_kind: messages_unread_creche
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: "{{ 'mdi:mailbox-open' if states(entity) | int(0) > 0 else 'mdi:mailbox-outline' }}"
                    layout: horizontal
                    multiline_secondary: true
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: De la crèche
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% set total = state_attr(entity, 'total') %}
                      {% if n == 0 %}Aucun message non lu
                      {% else %}{{ n }} non lu{{ 's' if n != 1 }}{% if total is not none %} · {{ total }} au total{% endif %}
                      {% endif %}
                      {% set d = state_attr(entity, 'last_unread_date') or state_attr(entity, 'last_message_date') %}
                      {% if d %} · {{ d }}{% endif %}
                    icon_color: "{{ 'red' if states(entity) | int(0) > 0 else 'teal' }}"
                    badge_icon: "{{ 'mdi:bell-badge' if states(entity) | int(0) > 0 else none }}"
                    badge_color: red
                - attributes:
                    optifamily_kind: messages_unread_me
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: "{{ 'mdi:mailbox-up' if states(entity) | int(0) > 0 else 'mdi:mailbox-outline' }}"
                    layout: horizontal
                    multiline_secondary: true
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: Vos envois
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% set total = state_attr(entity, 'total') %}
                      {% if n == 0 %}Rien en attente de lecture
                      {% else %}{{ n }} non lu{{ 's' if n != 1 }} côté crèche{% if total is not none %} · {{ total }} envoyé{{ 's' if total != 1 }}{% endif %}
                      {% endif %}
                    icon_color: "{{ 'orange' if states(entity) | int(0) > 0 else 'teal' }}"
                    badge_icon: "{{ 'mdi:bell-badge' if states(entity) | int(0) > 0 else none }}"
                    badge_color: orange

      - type: grid
        cards:
          - type: heading
            heading: Transmissions
            heading_style: title
            icon: mdi:clipboard-text-outline
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            sort:
              method: state
              numeric: true
              reverse: true
            card:
              type: vertical-stack
            card_param: cards
            filter:
              exclude:
                - state: "0"
                - state: unavailable
                - state: unknown
              include:
                - attributes:
                    optifamily_kind: transmissions
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    layout: vertical
                    multiline_secondary: true
                    tap_action:
                      action: navigate
                      navigation_path: transmissions
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 22px;
                          border: none;
                          box-shadow: none;
                        }
                        mushroom-state-info {
                          width: 100%;
                        }
                        span.secondary {
                          white-space: pre-line !important;
                          line-height: 1.35;
                        }
                    icon: mdi:clipboard-text-outline
                    icon_color: teal
                    badge_icon: mdi:bell-badge
                    badge_color: teal
                    primary: >
                      {{ state_attr(entity, 'enfant_libelle') or 'Enfant' }}
                      · {{ states(entity) | int(0) }}
                    secondary: >
                      {% set lignes = state_attr(entity, 'lignes') or [] %}
                      {% if not lignes %}Aucune transmission
                      {% else %}{{ lignes[:8] | join('\n') }}{% if lignes | length > 8 %}
                      …{% endif %}
                      {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Vie de la crèche
            heading_style: title
            icon: mdi:town-hall
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            card:
              type: vertical-stack
            card_param: cards
            filter:
              include:
                - attributes:
                    optifamily_kind: actualites_total
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:newspaper-variant-outline
                    icon_color: teal
                    layout: horizontal
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: Actualités
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% if n == 0 %}Aucune actualité
                      {% elif n == 1 %}1 actualité
                      {% else %}{{ n }} actualités
                      {% endif %}
                - attributes:
                    optifamily_kind: documents_total
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:file-document-outline
                    icon_color: cyan
                    layout: horizontal
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: Documents
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% if n == 0 %}Aucun document
                      {% elif n == 1 %}1 document
                      {% else %}{{ n }} documents
                      {% endif %}
                - attributes:
                    optifamily_kind: facturation_total
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    icon: mdi:receipt-text-outline
                    icon_color: amber
                    layout: horizontal
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card { border-radius: 22px; border: none; box-shadow: none; }
                    primary: Factures
                    secondary: >
                      {% set n = states(entity) | int(0) %}
                      {% if n == 0 %}Aucune facture
                      {% elif n == 1 %}1 facture
                      {% else %}{{ n }} factures
                      {% endif %}

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Semaine à venir
            heading_style: title
            icon: mdi:view-week-outline
          - type: custom:auto-entities
            show_empty: false
            unique: entity
            card:
              type: custom:week-planner-card
              days: 7
              startingDay: today
              locale: fr
              timeFormat: HH:mm
              compact: true
              showNavigation: true
              showLegend: false
              combineSimilarEvents: true
              noCardBackground: true
              eventBackground: color-mix(in srgb, #0d9488 14%, var(--ha-card-background, var(--card-background-color)))
              dayFormat: '''<span class="number">''d''</span><span class="month">''ccc''</span>'''
              texts:
                noEvents: Aucun créneau
                fullDay: Journée entière
                today: Aujourd’hui
                tomorrow: Demain
                yesterday: Hier
                moreEvents: Plus de créneaux
              card_mod:
                style: |
                  ha-card {
                    border-radius: 20px;
                    border: none;
                    box-shadow: none;
                    background: transparent;
                    padding: 0;
                    --events-margin-top: 6px;
                    --event-spacing: 3px;
                    --event-padding: 3px 6px;
                    --event-border-width: 3px;
                    --event-font-size: 0.72rem;
                    --event-line-height: 1.15em;
                  }
                  .day {
                    border-radius: 12px;
                    background: color-mix(in srgb, var(--primary-color) 7%, var(--ha-card-background, var(--card-background-color)));
                    padding: 6px 5px 8px;
                    min-height: 0;
                  }
                  .day.today {
                    box-sizing: border-box;
                    background: color-mix(in srgb, #0d9488 20%, var(--ha-card-background, var(--card-background-color)));
                    box-shadow: inset 0 0 0 1.5px #0d9488;
                  }
                  .day.saturday,
                  .day.sunday {
                    opacity: 0.88;
                  }
                  .event {
                    border-radius: 0 8px 8px 0;
                    border-top: none;
                    border-right: none;
                    border-bottom: none;
                  }
                  .event.past {
                    opacity: 0.45;
                  }
                  .event[data-summary*="Fermeture" i],
                  .event[data-summary*="fermeture" i] {
                    --border-color: #dc2626;
                    background: color-mix(in srgb, #dc2626 14%, var(--ha-card-background, var(--card-background-color)));
                  }
                  .number {
                    display: block;
                    font-size: 1.15rem;
                    font-weight: 750;
                    letter-spacing: -0.02em;
                    line-height: 1.05;
                  }
                  .month {
                    display: block;
                    font-size: 0.58rem;
                    letter-spacing: 0.06em;
                    text-transform: uppercase;
                    opacity: 0.65;
                    font-weight: 600;
                    margin-bottom: 2px;
                  }
            card_param: calendars
            filter:
              template: >
                {% set colors = ['#0d9488', '#0284c7', '#d97706', '#7c3aed', '#db2777', '#059669'] %}
                {% set fam = states.calendar
                  | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'planning_family')
                  | list %}
                {% set kids = states.calendar
                  | selectattr('attributes', 'contains', 'optifamily_kind')
                  | selectattr('attributes.optifamily_kind', 'eq', 'planning')
                  | list %}
                {% set src = fam if fam else kids %}
                {% set ns = namespace(items=[]) %}
                {% for c in src %}
                  {% set name = state_attr(c.entity_id, 'friendly_name')
                    or c.attributes.friendly_name
                    or c.name
                    or 'OptiFamily' %}
                  {% set ns.items = ns.items + [{
                    'entity': c.entity_id,
                    'name': name,
                    'color': colors[loop.index0 % (colors | length)],
                    'icon': 'mdi:baby-carriage' if fam else 'mdi:baby-face-outline'
                  }] %}
                {% endfor %}
                {{ ns.items }}

  # ─── Enfants ───────────────────────────────────────────────────
  - title: Enfants
    path: enfants
    icon: mdi:account-child-circle
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Fiches individuelles
            heading_style: title
            icon: mdi:card-account-details-outline
          - type: markdown
            content: >
              {% set s = states.sensor
                | selectattr('attributes', 'contains', 'optifamily_kind')
                | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
              {% set n = (s[0].state | int(0)) if s else 0 %}
              {% if n == 0 %}Aucun enfant détecté.
              {% elif n == 1 %}1 enfant suivi·e — présence, transmissions, albums et créneaux.
              {% else %}{{ n }} enfants suivis — présence, transmissions, albums et créneaux.
              {% endif %}
            card_mod:
              style: |
                ha-card {
                  border: none;
                  box-shadow: none;
                  background: transparent;
                  --ha-markdown-font-size: 0.9rem;
                  opacity: 0.75;
                }

      - type: grid
        column_span: 2
        cards:
          - type: custom:auto-entities
            show_empty: false
            unique: entity_id
            sort:
              method: attribute
              attribute: enfant_libelle
            card:
              type: vertical-stack
            card_param: cards
            filter:
              exclude:
                - state: unavailable
              include:
                - attributes:
                    optifamily_kind: present
                  options:
                    type: vertical-stack
                    cards:
                      - type: custom:mushroom-template-card
                        entity: this.entity_id
                        layout: horizontal
                        multiline_secondary: true
                        tap_action:
                          action: more-info
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 24px 24px 8px 8px;
                              border: none;
                              box-shadow: none;
                              background: linear-gradient(
                                120deg,
                                color-mix(in srgb, #0d9488 16%, var(--ha-card-background, var(--card-background-color))),
                                var(--ha-card-background, var(--card-background-color))
                              );
                            }
                        icon: >
                          {% set st = states(entity) %}
                          {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                          {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                          {% if st == 'absent' %}mdi:home-heart
                          {% elif st != 'présent' %}mdi:help-circle-outline
                          {% elif times | length < 2 %}mdi:baby-face-outline
                          {% else %}
                            {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                            {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                            {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% if to_start > 0 %}mdi:car-child-seat
                            {% elif to_end > 90 %}mdi:baby-face-outline
                            {% elif to_end > 0 %}mdi:clock-end
                            {% else %}mdi:home-import-outline
                            {% endif %}
                          {% endif %}
                        icon_color: >
                          {% set st = states(entity) %}
                          {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                          {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                          {% if st == 'absent' %}blue-grey
                          {% elif st != 'présent' %}amber
                          {% elif times | length < 2 %}teal
                          {% else %}
                            {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                            {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                            {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% if to_start > 0 %}amber
                            {% elif to_end > 90 %}teal
                            {% elif to_end > 0 %}orange
                            {% else %}blue-grey
                            {% endif %}
                          {% endif %}
                        primary: "{{ state_attr(entity, 'enfant_libelle') }}"
                        secondary: >
                          {% set st = states(entity) %}
                          {% set name = state_attr(entity, 'enfant_libelle') %}
                          {% set label = (state_attr(entity, 'creneaux') or [state_attr(entity, 'creneaux_libelle') or ''])[0] %}
                          {% set times = (label or '') | regex_findall('(\\d{1,2}):(\\d{2})') %}
                          {% if st == 'absent' %}{{ name }} est à la maison
                          {% elif st != 'présent' %}Statut du jour inconnu
                          {% elif times | length < 2 %}{{ name }} est en crèche
                          {% else %}
                            {% set start = today_at(times[0][0] ~ ':' ~ times[0][1]) %}
                            {% set end = today_at(times[1][0] ~ ':' ~ times[1][1]) %}
                            {% set to_start = ((as_timestamp(start) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% set to_end = ((as_timestamp(end) - as_timestamp(now())) / 60) | round(0, 'floor') | int %}
                            {% if to_start > 90 %}Allez déposer {{ name }} à {{ times[0][0] }}:{{ times[0][1] }}
                            {% elif to_start > 0 %}Allez déposer {{ name }} {% if to_start >= 60 %}dans {{ to_start // 60 }} h{% if to_start % 60 %} {{ to_start % 60 }} min{% endif %}{% else %}dans {{ to_start }} min{% endif %}
                            {% elif to_end > 90 %}En crèche · allez chercher à {{ times[1][0] }}:{{ times[1][1] }}
                            {% elif to_end > 0 %}Allez chercher {{ name }} {% if to_end >= 60 %}dans {{ to_end // 60 }} h{% if to_end % 60 %} {{ to_end % 60 }} min{% endif %}{% else %}dans {{ to_end }} min{% endif %}
                            {% else %}{{ name }} est rentré·e
                            {% endif %}
                          {% endif %}
                      - type: custom:mushroom-chips-card
                        alignment: justify
                        card_mod:
                          style: |
                            ha-card {
                              border-radius: 8px 8px 24px 24px;
                              border: none;
                              box-shadow: none;
                              margin-top: -6px;
                            }
                        chips:
                          - type: template
                            icon: mdi:clipboard-text-outline
                            icon_color: teal
                            content: >
                              {% set id = state_attr('this.entity_id', 'enfant_id') %}
                              {% set tr = states.sensor
                                | selectattr('attributes', 'contains', 'optifamily_kind')
                                | selectattr('attributes.optifamily_kind', 'eq', 'transmissions')
                                | selectattr('attributes.enfant_id', 'eq', id) | list %}
                              {% set n = (tr[0].state | int(0)) if tr else 0 %}
                              {% if n == 0 %}Aucune transmission
                              {% elif n == 1 %}1 transmission
                              {% else %}{{ n }} transmissions
                              {% endif %}
                            tap_action:
                              action: more-info
                              entity: this.entity_id
                          - type: template
                            icon: mdi:image-multiple-outline
                            icon_color: purple
                            content: >
                              {% set id = state_attr('this.entity_id', 'enfant_id') %}
                              {% set al = states.sensor
                                | selectattr('attributes', 'contains', 'optifamily_kind')
                                | selectattr('attributes.optifamily_kind', 'eq', 'albums')
                                | selectattr('attributes.enfant_id', 'eq', id) | list %}
                              {% set n = (al[0].state | int(0)) if al else 0 %}
                              {% if n == 0 %}Aucun album
                              {% elif n == 1 %}1 album
                              {% else %}{{ n }} albums
                              {% endif %}
                            tap_action:
                              action: more-info
                              entity: this.entity_id
                          - type: template
                            icon: mdi:calendar-month-outline
                            icon_color: cyan
                            content: >
                              {% set id = state_attr('this.entity_id', 'enfant_id') %}
                              {% set pl = states.sensor
                                | selectattr('attributes', 'contains', 'optifamily_kind')
                                | selectattr('attributes.optifamily_kind', 'eq', 'planning_slots')
                                | selectattr('attributes.enfant_id', 'eq', id) | list %}
                              {% set n = (pl[0].state | int(0)) if pl else 0 %}
                              {{ n }} créneau{{ 'x' if n != 1 }} ce mois
                            tap_action:
                              action: more-info
                              entity: this.entity_id

  # ─── Transmissions (journal jour par jour) ─────────────────────
  - title: Transmissions
    path: transmissions
    icon: mdi:clipboard-text-clock-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Journal
            heading_style: title
            icon: mdi:book-open-page-variant-outline
          - type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  border: none;
                  box-shadow: none;
                  background: transparent;
                }
            chips:
              - type: template
                icon: mdi:chevron-left
                content: Hier
                tap_action:
                  action: call-service
                  service: optifamily.shift_transmissions_date
                  data:
                    days: -1
              - type: template
                icon: mdi:calendar-today
                icon_color: teal
                content: >
                  {% set j = states.sensor
                    | selectattr('attributes', 'contains', 'optifamily_kind')
                    | selectattr('attributes.optifamily_kind', 'eq', 'transmissions_journal')
                    | list %}
                  {% set d = (j[0].attributes.date if j else none) or now().date().isoformat() %}
                  {{ d }}
                tap_action:
                  action: call-service
                  service: optifamily.set_transmissions_date
                  data:
                    date: "{{ now().date().isoformat() }}"
              - type: template
                icon: mdi:chevron-right
                content: Demain
                tap_action:
                  action: call-service
                  service: optifamily.shift_transmissions_date
                  data:
                    days: 1
              - type: template
                icon: mdi:calendar-refresh
                content: Aujourd’hui
                tap_action:
                  action: call-service
                  service: optifamily.set_transmissions_date
                  data:
                    date: "{{ now().date().isoformat() }}"

      - type: grid
        column_span: 2
        cards:
          - type: custom:auto-entities
            show_empty: true
            unique: entity_id
            sort:
              method: attribute
              attribute: enfant_libelle
            card:
              type: vertical-stack
            card_param: cards
            filter:
              exclude:
                - state: unavailable
              include:
                - attributes:
                    optifamily_kind: transmissions_journal
                  options:
                    type: custom:mushroom-template-card
                    entity: this.entity_id
                    layout: vertical
                    multiline_secondary: true
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 24px;
                          border: none;
                          box-shadow: none;
                          background: linear-gradient(
                            120deg,
                            color-mix(in srgb, #0d9488 14%, var(--ha-card-background, var(--card-background-color))),
                            var(--ha-card-background, var(--card-background-color))
                          );
                        }
                        span.secondary {
                          white-space: pre-line !important;
                          line-height: 1.4;
                        }
                    icon: mdi:clipboard-text-clock-outline
                    icon_color: teal
                    primary: >
                      {{ state_attr(entity, 'enfant_libelle') or 'Enfant' }}
                      · {{ state_attr(entity, 'date') or '' }}
                      · {{ states(entity) | int(0) }}
                    secondary: >
                      {% set lignes = state_attr(entity, 'lignes') or [] %}
                      {% if not lignes %}Aucune transmission ce jour
                      {% else %}{{ lignes | join('\n') }}
                      {% endif %}

  # ─── Calendrier ────────────────────────────────────────────────
  # calendar exige des entity_id string ; auto-entities les wrap en {entity:…}
  # → carte complète via card_param: cards + card_mod pour remplir le panel.
  - title: Calendrier
    path: calendrier
    icon: mdi:calendar-month
    type: panel
    cards:
      - type: custom:auto-entities
        show_empty: false
        card:
          type: vertical-stack
        card_param: cards
        card_mod:
          style: |
            :host {
              display: block;
              height: 100%;
            }
            hui-vertical-stack-card {
              height: 100%;
            }
            hui-vertical-stack-card #root {
              height: 100%;
              gap: 0;
            }
            hui-calendar-card {
              height: 100%;
              display: block;
            }
        filter:
          template: >
            {% set fam = states.calendar
              | selectattr('attributes', 'contains', 'optifamily_kind')
              | selectattr('attributes.optifamily_kind', 'eq', 'planning_family')
              | map(attribute='entity_id') | list %}
            {% set kids = states.calendar
              | selectattr('attributes', 'contains', 'optifamily_kind')
              | selectattr('attributes.optifamily_kind', 'eq', 'planning')
              | map(attribute='entity_id') | list %}
            {% set src = fam if fam else kids %}
            {{ [{
              'type': 'calendar',
              'initial_view': 'dayGridMonth',
              'entities': src,
              'card_mod': {
                'style': 'ha-card { height: 100%; display: flex; flex-direction: column; box-sizing: border-box; } ha-full-calendar { flex: 1 1 auto; height: 100%; --calendar-height: calc(100vh - var(--header-height, 56px) - 24px); min-height: var(--calendar-height); }'
              }
            }] if src else [] }}
