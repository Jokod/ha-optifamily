# Package Home Assistant — confort notifications OptiFamily (optionnel)
#
# Ce package gère UNIQUEMENT le mode silencieux et les scripts associés.
# La logique métier (phase journée, attention, résumé) vit dans l’intégration.
#
# Installation :
# 1. Activez les packages dans configuration.yaml :
#      homeassistant:
#        packages: !include_dir_named packages
# 2. Copiez ce fichier dans config/packages/optifamily_helpers.yaml
# 3. Redémarrez Home Assistant.

# ─── Helpers ─────────────────────────────────────────────────────
input_boolean:
  optifamily_quiet_hours:
    name: OptiFamily — mode silencieux
    icon: mdi:bell-off-outline
    initial: false

  optifamily_quiet_auto:
    name: OptiFamily — silencieux automatique
    icon: mdi:bell-sleep
    initial: true

input_datetime:
  optifamily_quiet_start:
    name: OptiFamily — début silencieux
    has_date: false
    has_time: true
    icon: mdi:weather-night
    initial: "21:00:00"

  optifamily_quiet_end:
    name: OptiFamily — fin silencieux
    has_date: false
    has_time: true
    icon: mdi:weather-sunset-up
    initial: "06:00:00"

# ─── Scripts ─────────────────────────────────────────────────────
script:
  optifamily_notify_resume:
    alias: OptiFamily — Envoyer le résumé
    icon: mdi:send
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.optifamily_quiet_hours
        state: "off"
      - variables:
          phase_s: >
            {% set s = states.sensor
              | selectattr('attributes', 'contains', 'optifamily_kind')
              | selectattr('attributes.optifamily_kind', 'eq', 'phase_journee')
              | list %}
            {{ s[0].entity_id if s else none }}
          resume_s: >
            {% set s = states.sensor
              | selectattr('attributes', 'contains', 'optifamily_kind')
              | selectattr('attributes.optifamily_kind', 'eq', 'resume')
              | list %}
            {{ s[0].entity_id if s else none }}
          titre: >
            OptiFamily — {{ state_attr(phase_s, 'libelle')
              | default(states(phase_s) if phase_s else 'Résumé') }}
          corps: >
            {{ states(resume_s) if resume_s
               and states(resume_s) not in ['unknown', 'unavailable', none, '']
               else 'Aucun résumé disponible.' }}
      - action: notify.persistent_notification
        data:
          title: "{{ titre }}"
          message: "{{ corps }}"

  optifamily_toggle_quiet:
    alias: OptiFamily — Basculer mode silencieux
    icon: mdi:bell-cog-outline
    mode: single
    sequence:
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.optifamily_quiet_hours

# ─── Automatisations (silencieux planifié) ────────────────────────
automation:
  - id: optifamily_quiet_hours_on
    alias: OptiFamily — Activer silencieux (horaire)
    description: Active le mode silencieux à l’heure configurée (si auto activé).
    mode: single
    trigger:
      - platform: time
        at: input_datetime.optifamily_quiet_start
    condition:
      - condition: state
        entity_id: input_boolean.optifamily_quiet_auto
        state: "on"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.optifamily_quiet_hours

  - id: optifamily_quiet_hours_off
    alias: OptiFamily — Désactiver silencieux (horaire)
    description: Coupe le mode silencieux à l’heure configurée (si auto activé).
    mode: single
    trigger:
      - platform: time
        at: input_datetime.optifamily_quiet_end
    condition:
      - condition: state
        entity_id: input_boolean.optifamily_quiet_auto
        state: "on"
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.optifamily_quiet_hours
