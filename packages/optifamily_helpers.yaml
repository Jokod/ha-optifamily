# Package Home Assistant — helpers OptiFamily (optionnel)
#
# Installation :
# 1. Activez les packages dans configuration.yaml :
#      homeassistant:
#        packages: !include_dir_named packages
# 2. Copiez ce fichier dans config/packages/optifamily_helpers.yaml
# 3. Adaptez les entity_id ci-dessous à votre instance.
# 4. Redémarrez Home Assistant.
#
# Ne contient aucune donnée personnelle : uniquement des templates.

input_boolean:
  optifamily_quiet_hours:
    name: OptiFamily — mode silencieux
    icon: mdi:bell-off-outline
    initial: false

template:
  - sensor:
      - name: "OptiFamily résumé texte"
        unique_id: optifamily_resume_texte
        icon: mdi:text-box-outline
        state: >
          {% set enfants_s = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
          {% set liste = (enfants_s[0].attributes.liste if enfants_s else []) or [] %}
          {% set presents = liste | selectattr('presence', 'equalto', 'présent')
                                   | map(attribute='libelle') | list %}
          {% set msg_c = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_creche') | list %}
          {% set msg_m = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'messages_unread_me') | list %}
          {{ presents | length }} présent(s) · {{ (msg_c[0].state if msg_c else 0) | int(0) }} msg crèche · {{ (msg_m[0].state if msg_m else 0) | int(0) }} msg moi
        attributes:
          presents: >
            {% set enfants_s = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
            {% set liste = (enfants_s[0].attributes.liste if enfants_s else []) or [] %}
            {{ liste | selectattr('presence', 'equalto', 'présent')
                     | map(attribute='libelle') | list }}
          detail: >
            {% set enfants_s = states.sensor | selectattr('attributes.optifamily_kind', 'eq', 'enfants') | list %}
            {% set liste = (enfants_s[0].attributes.liste if enfants_s else []) or [] %}
            {% for e in liste -%}
            {{ e.libelle }}: {{ e.presence }}{% if e.creneaux %} ({{ e.creneaux | join(', ') }}){% endif %}
            {% endfor %}

script:
  optifamily_notify_resume:
    alias: OptiFamily — Envoyer le résumé
    icon: mdi:send
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.optifamily_quiet_hours
        state: "off"
      - service: notify.persistent_notification
        data:
          title: OptiFamily
          message: "{{ state_attr('sensor.optifamily_resume_texte', 'detail') }}"
