# Services OptiFamily

set_transmissions_date:
  name: Définir la date des transmissions
  description: Charge le journal des transmissions pour une date (défaut = aujourd'hui).
  fields:
    date:
      name: Date
      description: "Jour au format YYYY-MM-DD (défaut : aujourd'hui)"
      required: false
      selector:
        date:
    config_entry_id:
      name: Entrée OptiFamily (optionnel)
      description: Si plusieurs crèches, précisez l'entry_id
      required: false
      selector:
        text:

shift_transmissions_date:
  name: Décaler la date des transmissions
  description: Jour précédent (-1) ou suivant (+1) pour le journal.
  fields:
    days:
      name: Décalage
      description: Nombre de jours (ex. -1 = hier, 1 = demain)
      required: true
      default: -1
      selector:
        number:
          min: -30
          max: 30
          mode: box
    config_entry_id:
      name: Entrée OptiFamily (optionnel)
      required: false
      selector:
        text:

set_documents_scope:
  name: Scope des documents
  description: Affiche les documents crèche, famille ou enfant sur le capteur Documents.
  fields:
    scope:
      name: Scope
      required: true
      selector:
        select:
          options:
            - creche
            - famille
            - enfant
    enfant_id:
      name: Identifiant enfant
      description: Requis si scope = enfant
      required: false
      selector:
        number:
          mode: box
    config_entry_id:
      name: Entrée OptiFamily (optionnel)
      required: false
      selector:
        text:

set_album:
  name: Sélectionner un album
  description: >
    Affiche les photos d'un album sur le capteur Albums de l'enfant.
    La liste des photos est mise en cache (pas de re-appel API à chaque affichage).
  fields:
    enfant_id:
      name: Identifiant enfant
      required: true
      selector:
        number:
          mode: box
    album_id:
      name: Identifiant album
      description: Laisser vide pour désélectionner
      required: false
      selector:
        number:
          mode: box
    config_entry_id:
      name: Entrée OptiFamily (optionnel)
      required: false
      selector:
        text:

read_actualite:
  name: Lire une actualité
  description: >
    Charge le détail d'une actualité au clic. Attention : l'API incrémente une vue.
    Le détail est mis en cache pour ne pas renvoyer de vues inutiles.
  fields:
    id:
      name: Identifiant actualité
      required: true
      selector:
        text:
    config_entry_id:
      name: Entrée OptiFamily (optionnel)
      required: false
      selector:
        text:

download:
  name: Télécharger un média
  description: >
    Télécharge une photo, un document ou une facture vers config/www/optifamily/.
    Photos albums → www/optifamily/albums/ (/local/optifamily/albums/…).
    Photos actualités → www/optifamily/actualites/ (/local/optifamily/actualites/…).
    Documents / factures → www/optifamily/ à la racine. Les photos déjà présentes
    ne sont pas re-téléchargées. Événement optifamily_download_ready en cas de succès.
  fields:
    kind:
      name: Type
      required: true
      selector:
        select:
          options:
            - photo
            - document
            - facture
    id:
      name: Identifiant
      required: true
      selector:
        text:
    source:
      name: Source photo
      description: Dossier de destination (albums ou actualites). Détecté auto si omis.
      required: false
      selector:
        select:
          options:
            - albums
            - actualites
    download_url:
      name: URL (optionnel)
      description: Si fournie, utilisée directement
      required: false
      selector:
        text:
    enfant_id:
      name: Identifiant enfant
      required: false
      selector:
        number:
          mode: box
    config_entry_id:
      name: Entrée OptiFamily (optionnel)
      required: false
      selector:
        text:

refresh:
  name: Synchroniser
  description: >
    Force un rafraîchissement immédiat des données OptiFamily
    (ignore la pause nocturne / crèche fermée).
  fields:
    config_entry_id:
      name: Entrée OptiFamily (optionnel)
      description: Si plusieurs crèches, précisez l'entry_id
      required: false
      selector:
        text:
