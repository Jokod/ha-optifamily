blueprint:
  name: OptiFamily — Script résumé famille
  description: >
    Script réutilisable qui construit un texte de résumé à partir des capteurs
    d’intégration (enfants, messages, phase/résumé optionnels).
    Respecte le mode silencieux optionnel (package helpers).
  domain: script
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    enfants_sensor:
      name: Capteur « Enfants »
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    messages_sensor:
      name: Capteur messages non lus
      description: >
        Capteur « Messages non lus (crèche) » ou « Messages non lus (moi) »
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    phase_sensor:
      name: Capteur phase journée (optionnel)
      description: Capteur OptiFamily « Phase journée » (optifamily_kind: phase_journee)
      default:
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    resume_sensor:
      name: Capteur résumé (optionnel)
      description: Capteur OptiFamily « Résumé journée » (optifamily_kind: resume)
      default:
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    quiet_hours:
      name: Mode silencieux (optionnel)
      description: >
        Si « on », le script ne notifie pas. Ex. input_boolean.optifamily_quiet_hours.
      default:
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_action:
      name: Notification
      selector:
        action:

sequence:
  - variables:
      enfants_entity: !input enfants_sensor
      messages_entity: !input messages_sensor
      phase_entity: !input phase_sensor
      resume_entity: !input resume_sensor
      quiet_entity: !input quiet_hours
  - condition: template
    value_template: >
      {{ quiet_entity in [none, '', 'none'] or not is_state(quiet_entity, 'on') }}
  - variables:
      liste: "{{ state_attr(enfants_entity, 'liste') | default([]) }}"
      presents: >
        {{ liste | selectattr('presence', 'equalto', 'présent')
                 | map(attribute='libelle') | list }}
      unread: "{{ states(messages_entity) | int(0) }}"
      transmissions_total: >
        {{ liste | map(attribute='transmissions') | map('int', 0) | sum }}
      phase_lib: >
        {{ state_attr(phase_entity, 'libelle')
           if phase_entity not in [none, '', 'none'] else none }}
      resume_txt: >
        {{ states(resume_entity)
           if resume_entity not in [none, '', 'none']
              and states(resume_entity) not in ['unknown', 'unavailable', none, '']
           else none }}
      resume: >
        OptiFamily — {{ now().strftime('%d/%m %H:%M') }}
        {% if resume_txt %}
        {{ resume_txt }}
        {% else %}
        {% if phase_lib and phase_lib not in ['unknown', 'unavailable', none] %}
        Phase : {{ phase_lib }}
        {% endif %}
        Présents : {{ presents | join(', ') if presents else 'aucun' }}
        Messages non lus ({{ state_attr(messages_entity, 'origine') | default('?') }}) : {{ unread }}
        Transmissions du jour : {{ transmissions_total }}
        {% endif %}
  - action: !input notify_action
    data:
      title: "OptiFamily"
      message: "{{ resume }}"

mode: single
