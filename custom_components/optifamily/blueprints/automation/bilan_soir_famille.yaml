blueprint:
  name: OptiFamily — Bilan du soir (famille)
  description: >
    Envoie chaque soir un résumé : enfants présents aujourd'hui, messages non lus,
    transmissions du jour (via le capteur agrégé « Enfants »).
    Respecte le mode silencieux optionnel (package helpers).
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    enfants_sensor:
      name: Capteur « Enfants »
      description: Capteur agrégé OptiFamily (attribut liste)
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    messages_sensor:
      name: Capteur messages non lus
      description: >
        Préférez « Messages non lus (crèche) » pour le bilan
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    bilan_time:
      name: Heure du bilan
      default: "19:30:00"
      selector:
        time:
    only_if_activity:
      name: Envoyer seulement s'il y a eu de l'activité
      description: Présence, message non lu ou au moins une transmission
      default: true
      selector:
        boolean:
    quiet_hours:
      name: Mode silencieux (optionnel)
      description: >
        Si « on », aucune notification. Ex. input_boolean.optifamily_quiet_hours.
      default:
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_action:
      name: Notification
      selector:
        action:

trigger_variables:
  quiet_entity: !input quiet_hours

trigger:
  - platform: time
    at: !input bilan_time

condition:
  - condition: template
    value_template: >
      {{ quiet_entity in [none, '', 'none'] or not is_state(quiet_entity, 'on') }}

action:
  - variables:
      enfants_entity: !input enfants_sensor
      messages_entity: !input messages_sensor
      only_activity: !input only_if_activity
      liste: "{{ state_attr(enfants_entity, 'liste') | default([]) }}"
      presents: >
        {{ liste | selectattr('presence', 'equalto', 'présent')
                 | map(attribute='libelle') | list }}
      transmissions_total: >
        {{ liste | map(attribute='transmissions') | map('int', 0) | sum }}
      unread: "{{ states(messages_entity) | int(0) }}"
      has_activity: >
        {{ presents | length > 0 or unread > 0 or transmissions_total > 0 }}
      phase: "{{ states('sensor.optifamily_phase_journee') }}"
      phase_lib: "{{ state_attr('sensor.optifamily_phase_journee', 'libelle') }}"
  - condition: template
    value_template: "{{ (not only_activity) or has_activity }}"
  - variables:
      lignes_enfants: >
        {% for e in liste %}
        • {{ e.libelle }} — {{ e.presence }}
        {%- if e.creneaux %} ({{ e.creneaux | join(', ') }}){% endif %}
        {%- if e.transmissions %} · {{ e.transmissions }} transmission(s){% endif %}

        {% endfor %}
  - action: !input notify_action
    data:
      title: "OptiFamily — Bilan du soir"
      message: >
        {% if phase_lib and phase not in ['unknown', 'unavailable', none, ''] %}
        Phase : {{ phase_lib }}.
        {% endif %}
        Présents : {{ presents | join(', ') if presents else 'aucun' }}.
        Messages non lus : {{ unread }}.
        Transmissions : {{ transmissions_total }}.

        {{ lignes_enfants }}

mode: single
