blueprint:
  name: OptiFamily — Alerte messages non lus (seuil)
  description: >
    Notifie quand le nombre de messages non lus atteint ou dépasse un seuil
    (ex. 1, 3, 5), avec anti-spam (mode single).
    Respecte le mode silencieux optionnel (package helpers).
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    messages_sensor:
      name: Capteur messages non lus
      description: >
        Capteur « Messages non lus (crèche) » ou « Messages non lus (moi) »
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    threshold:
      name: Seuil
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box
    quiet_hours:
      name: Mode silencieux (optionnel)
      description: >
        Si « on », aucune notification. Ex. input_boolean.optifamily_quiet_hours.
      default:
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_action:
      name: Notification
      selector:
        action:

trigger_variables:
  quiet_entity: !input quiet_hours

trigger:
  - platform: numeric_state
    entity_id: !input messages_sensor
    above: !input threshold

condition:
  - condition: template
    value_template: >
      {{ trigger.from_state.state | int(0) < trigger.to_state.state | int(0) }}
  - condition: template
    value_template: >
      {{ quiet_entity in [none, '', 'none'] or not is_state(quiet_entity, 'on') }}

action:
  - variables:
      messages_entity: !input messages_sensor
      seuil: !input threshold
      origine_raw: "{{ state_attr(messages_entity, 'origine') | default('') }}"
      origine: >
        {{ 'Moi' if origine_raw == 'moi'
           else ('Crèche' if origine_raw == 'creche' else (origine_raw or 'inconnu')) }}
      last_date: >
        {{ state_attr(messages_entity, 'last_unread_date_fr')
           or state_attr(messages_entity, 'last_message_date_fr')
           or state_attr(messages_entity, 'last_unread_date')
           or state_attr(messages_entity, 'last_message_date')
           | default('n/a') }}
  - action: !input notify_action
    data:
      title: "OptiFamily — Messages"
      message: >
        {{ states(messages_entity) | int(0) }} message(s) non lu(s) ({{ origine }})
        (seuil : {{ seuil }}).
        Dernier : {{ last_date }}.

mode: single
