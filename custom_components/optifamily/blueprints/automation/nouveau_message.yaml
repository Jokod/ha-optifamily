blueprint:
  name: OptiFamily — Notification nouveau message
  description: >
    Envoie une notification lorsque le nombre de messages non lus optiFamily augmente.
    Préférez le capteur « Messages non lus (crèche) » pour les alertes reçues.
    Respecte le mode silencieux optionnel (package helpers).
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    messages_sensor:
      name: Capteur messages non lus
      description: >
        Capteur OptiFamily « Messages non lus (crèche) » ou « Messages non lus (moi) »
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    quiet_hours:
      name: Mode silencieux (optionnel)
      description: >
        Si « on », aucune notification. Ex. input_boolean.optifamily_quiet_hours.
      default:
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_action:
      name: Action de notification
      description: >
        Action à exécuter pour notifier l'utilisateur
        (ex. notify.mobile_app_mon_telephone).
      selector:
        action:

trigger_variables:
  messages_entity: !input messages_sensor
  quiet_entity: !input quiet_hours

trigger:
  - platform: state
    entity_id: !input messages_sensor

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
  - condition: template
    value_template: >
      {{ quiet_entity in [none, '', 'none'] or not is_state(quiet_entity, 'on') }}

action:
  - variables:
      unread_count: "{{ states(messages_entity) | int(0) }}"
      last_date: "{{ state_attr(messages_entity, 'last_unread_date') or state_attr(messages_entity, 'last_message_date') }}"
      origine: "{{ state_attr(messages_entity, 'origine') | default('inconnu') }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ last_date is not none }}"
        sequence:
          - action: !input notify_action
            data:
              title: "OptiFamily"
              message: >
                Vous avez {{ unread_count }} message(s) non lu(s) ({{ origine }}).
                Dernier message : {{ last_date }}.
    default:
      - action: !input notify_action
        data:
          title: "OptiFamily"
          message: "Vous avez {{ unread_count }} message(s) non lu(s) ({{ origine }})."

mode: single
