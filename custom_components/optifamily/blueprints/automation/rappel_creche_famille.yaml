blueprint:
  name: OptiFamily — Rappel crèche (tous les enfants)
  description: >
    Envoie une notification le matin si au moins un enfant est prévu en crèche.
    Adapté aux familles avec un ou plusieurs enfants.
    Respecte le mode silencieux optionnel (package helpers).
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    enfants_presents_sensor:
      name: Capteur enfants en crèche aujourd'hui
      description: Capteur OptiFamily « Enfants en crèche aujourd'hui »
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    reminder_time:
      name: Heure du rappel
      default: "07:30:00"
      selector:
        time:
    quiet_hours:
      name: Mode silencieux (optionnel)
      description: >
        Si « on », aucune notification. Ex. input_boolean.optifamily_quiet_hours.
      default:
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_action:
      name: Action de notification
      description: >
        Action à exécuter pour notifier l'utilisateur
        (ex. notify.mobile_app_mon_telephone).
      selector:
        action:

trigger_variables:
  presents_entity: !input enfants_presents_sensor
  quiet_entity: !input quiet_hours

trigger:
  - platform: time
    at: !input reminder_time

condition:
  - condition: numeric_state
    entity_id: !input enfants_presents_sensor
    above: 0
  - condition: template
    value_template: >
      {{ quiet_entity in [none, '', 'none'] or not is_state(quiet_entity, 'on') }}

action:
  - variables:
      noms: "{{ state_attr(presents_entity, 'noms') | default([]) }}"
      liste: "{{ state_attr(presents_entity, 'liste') | default([]) }}"
      details: >
        {% for e in liste if e.presence == 'présent' %}
        - {{ e.libelle }} : {{ e.creneaux | join(', ') if e.creneaux else 'horaires non disponibles' }}
        {% endfor %}
  - action: !input notify_action
    data:
      title: "Crèche aujourd'hui"
      message: >
        {{ states(presents_entity) | int }} enfant(s) en crèche :
        {{ noms | join(', ') }}.
        {{ details }}

mode: single
