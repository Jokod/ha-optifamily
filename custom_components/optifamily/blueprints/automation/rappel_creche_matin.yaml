blueprint:
  name: OptiFamily — Rappel crèche le matin
  description: >
    Envoie une notification le matin si l'enfant est prévu en crèche aujourd'hui,
    avec le détail des créneaux du jour.
    Respecte le mode silencieux optionnel (package helpers).
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    presence_sensor:
      name: Capteur présence aujourd'hui
      description: Capteur OptiFamily « Présent aujourd'hui » de l'enfant
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    reminder_time:
      name: Heure du rappel
      default: "07:30:00"
      selector:
        time:
    quiet_hours:
      name: Mode silencieux (optionnel)
      description: >
        Si « on », aucune notification. Ex. input_boolean.optifamily_quiet_hours.
      default:
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_action:
      name: Action de notification
      description: >
        Action à exécuter pour notifier l'utilisateur
        (ex. notify.mobile_app_mon_telephone).
      selector:
        action:
    child_name:
      name: Prénom de l'enfant (optionnel)
      description: Affiché dans le titre de la notification
      default: ""
      selector:
        text:

trigger_variables:
  presence_entity: !input presence_sensor
  quiet_entity: !input quiet_hours
  child_label: !input child_name

trigger:
  - platform: time
    at: !input reminder_time

condition:
  - condition: state
    entity_id: !input presence_sensor
    state: "présent"
  - condition: template
    value_template: >
      {{ quiet_entity in [none, '', 'none'] or not is_state(quiet_entity, 'on') }}

action:
  - variables:
      creneaux: "{{ state_attr(presence_entity, 'creneaux') | default([]) }}"
      horaires: >
        {% set raw = creneaux or [] %}
        {% if raw and raw[0] is mapping %}
          {% set labels = raw | map(attribute='label') | list %}
        {% else %}
          {% set labels = raw %}
        {% endif %}
        {{ labels | join(', ') if labels else 'Horaires non disponibles' }}
      titre: >
        {% if child_label %}
          Crèche — {{ child_label }}
        {% else %}
          Crèche aujourd'hui
        {% endif %}
  - action: !input notify_action
    data:
      title: "{{ titre }}"
      message: "Présence prévue aujourd'hui. Créneaux : {{ horaires }}."

mode: single
