blueprint:
  name: OptiFamily — Rappel créneau (déposer / chercher)
  description: >
    Notifie quand approche le dépôt ou la récupération, d’après la phase
    calculée par l’intégration (`phase_enfant`, `minutes`, `message` sur le
    capteur « Présent aujourd’hui »). Plus de parse d’horaires en Jinja.
    Respecte le mode silencieux optionnel (package helpers).
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    presence_sensor:
      name: Capteur présence
      description: Capteur OptiFamily « Présent aujourd’hui » de l’enfant
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    lead_minutes:
      name: Anticipation (minutes)
      description: >
        Notifier autant de minutes avant le dépôt / la récupération
        (indépendant de la fenêtre attention UI à 90 min).
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: min
          mode: slider
    notify_drop:
      name: Notifier le dépôt
      default: true
      selector:
        boolean:
    notify_pick:
      name: Notifier la récupération
      default: true
      selector:
        boolean:
    quiet_hours:
      name: Mode silencieux (optionnel)
      description: >
        Si cette entité est « on », aucune notification.
        Ex. input_boolean.optifamily_quiet_hours (package helpers).
        Laissez vide pour ignorer.
      default:
      selector:
        entity:
          filter:
            - domain: input_boolean
    notify_action:
      name: Notification
      selector:
        action:

trigger_variables:
  presence_entity: !input presence_sensor
  lead: !input lead_minutes
  do_drop: !input notify_drop
  do_pick: !input notify_pick
  quiet_entity: !input quiet_hours

trigger:
  - platform: template
    id: drop
    value_template: >
      {% if not do_drop %}
        false
      {% else %}
        {% set phase = state_attr(presence_entity, 'phase_enfant') %}
        {% set minutes = state_attr(presence_entity, 'minutes') %}
        {{ phase == 'deposer' and minutes is not none and minutes > 0 and minutes <= lead | int }}
      {% endif %}
  - platform: template
    id: pick
    value_template: >
      {% if not do_pick %}
        false
      {% else %}
        {% set phase = state_attr(presence_entity, 'phase_enfant') %}
        {% set minutes = state_attr(presence_entity, 'minutes') %}
        {{ phase == 'chercher' and minutes is not none and minutes > 0 and minutes <= lead | int }}
      {% endif %}

condition:
  - condition: template
    value_template: >
      {{ quiet_entity in [none, '', 'none'] or not is_state(quiet_entity, 'on') }}

action:
  - variables:
      enfant: "{{ state_attr(presence_entity, 'enfant_libelle') | default('Enfant') }}"
      message: "{{ state_attr(presence_entity, 'message') | default('') }}"
      debut: "{{ state_attr(presence_entity, 'debut') }}"
      fin: "{{ state_attr(presence_entity, 'fin') }}"
      minutes: "{{ state_attr(presence_entity, 'minutes') }}"
  - choose:
      - conditions:
          - condition: trigger
            id: drop
        sequence:
          - action: !input notify_action
            data:
              title: "OptiFamily — Déposer {{ enfant }}"
              message: >
                {{ message if message else
                   ('Départ prévu à ' ~ debut ~ ' (dans ≤ ' ~ lead ~ ' min).'
                    if debut else
                    'Il est bientôt l’heure de déposer ' ~ enfant ~ '.') }}
      - conditions:
          - condition: trigger
            id: pick
        sequence:
          - action: !input notify_action
            data:
              title: "OptiFamily — Chercher {{ enfant }}"
              message: >
                {{ message if message else
                   ('Récupération prévue à ' ~ fin ~ ' (dans ≤ ' ~ lead ~ ' min).'
                    if fin else
                    'Il est bientôt l’heure d’aller chercher ' ~ enfant ~ '.') }}

mode: single
