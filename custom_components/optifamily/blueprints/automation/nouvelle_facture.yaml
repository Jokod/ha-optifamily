blueprint:
  name: OptiFamily — Nouvelle facture
  description: >
    Notifie lorsque le nombre de factures du compte augmente.
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    factures_sensor:
      name: Capteur factures
      description: Capteur OptiFamily « Factures »
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    notify_action:
      name: Action de notification
      selector:
        action:

trigger:
  - platform: state
    entity_id: !input factures_sensor

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}

action:
  - variables:
      count: "{{ states(input.factures_sensor) | int(0) }}"
  - action: !input notify_action
    data:
      title: "OptiFamily — Facture"
      message: "{{ count }} facture(s) disponible(s) sur optiFamily."

mode: single
