blueprint:
  name: OptiFamily — Nouvel album / photos
  description: >
    Notifie lorsque le nombre d'albums d'un enfant augmente
    (nouvel album publié). Une photo ajoutée à un album existant
    n'est pas détectée. Une automatisation par enfant.
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    albums_sensor:
      name: Capteur albums
      description: Capteur OptiFamily « Albums » de l'enfant
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    notify_action:
      name: Action de notification
      selector:
        action:

trigger:
  - platform: state
    entity_id: !input albums_sensor

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}

action:
  - variables:
      count: "{{ states(input.albums_sensor) | int(0) }}"
      enfant: "{{ state_attr(input.albums_sensor, 'enfant_libelle') | default('Enfant') }}"
  - action: !input notify_action
    data:
      title: "Photos — {{ enfant }}"
      message: "{{ count }} album(s) disponible(s) sur optiFamily."

mode: single
