blueprint:
  name: OptiFamily — Nouveau document
  description: >
    Notifie lorsque le nombre de documents de la crèche augmente.
  domain: automation
  author: ha-optifamily
  homeassistant:
    min_version: 2025.9.0
  input:
    documents_sensor:
      name: Capteur documents
      description: Capteur OptiFamily « Documents »
      selector:
        entity:
          filter:
            - domain: sensor
              integration: optifamily
    notify_action:
      name: Action de notification
      selector:
        action:

trigger:
  - platform: state
    entity_id: !input documents_sensor

condition:
  - condition: template
    value_template: >
      {{ trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}

action:
  - variables:
      count: "{{ states(input.documents_sensor) | int(0) }}"
  - action: !input notify_action
    data:
      title: "OptiFamily — Document"
      message: "{{ count }} document(s) disponible(s) sur optiFamily."

mode: single
