# Thème OptiFamily — tokens panel (card-mod) + extras sections.
# Installé automatiquement dans config/themes/ par l'intégration.
# Recharger les thèmes une fois (Paramètres → Outils de développeur).

optifamily:
  # tokens consommés via card-mod
  optifamily-accent: "#2B6CB0"
  optifamily-accent-soft: "#EBF4FF"
  optifamily-ok: "#2F855A"
  optifamily-warn: "#C05621"
  optifamily-danger: "#C53030"
  optifamily-muted: "#718096"
  optifamily-surface: "#F7FAFC"
  optifamily-radius: "12px"
  # keep section vars as harmless extras for users who use sections
  ha-view-sections-column-min-width: 320px
  ha-view-sections-column-max-width: 960px
  ha-view-sections-column-gap: 16px
  ha-view-sections-row-gap: 12px
  ha-section-grid-column-gap: 12px
  ha-section-grid-row-gap: 10px
