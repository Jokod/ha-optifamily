# Thème OptiFamily — neutre (couleurs HA par défaut, aucune teinte forcée).
# Installé automatiquement dans config/themes/ par l'intégration.
# Recharger les thèmes une fois (Paramètres → Outils de développeur).

optifamily:
  # Layout sections uniquement (pas de palette clair/sombre custom)
  ha-view-sections-column-min-width: 320px
  ha-view-sections-column-max-width: 960px
  ha-view-sections-column-gap: 16px
  ha-view-sections-row-gap: 12px
  ha-section-grid-column-gap: 12px
  ha-section-grid-row-gap: 10px
